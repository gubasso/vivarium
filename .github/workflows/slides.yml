# slides — the deck's check lane.
#
# Every Markdown hook is excluded from `slides/` (ADR-0104), so whether the
# deck still builds is the whole check. A deck fails at the Slidev layer — an
# unknown layout, an icon from a set that is not installed, a component that
# no longer resolves — and none of that is visible to a linter reading the
# file as prose.
#
# Split out of ci.yml so the deck keeps its own named check. Both lanes now run
# on `master` and on pull requests, because the trunk's protection requires one
# gate job and `needs` resolves inside one file. This lane is therefore not in
# that gate: a red deck build reports and holds no merge. Move the job into
# ci.yml's `gate` list if the deck should ever block one.
#
# Runs through the devShell rather than actions/setup-node, unlike the deploy
# lane in pages.yml. This is the check lane, so the node that builds the deck
# here should be the node the repository pins — that is the whole reason every
# other check job goes through `nix develop`.
#
# Overlap worth knowing: a push to `master` that touches `slides/` also runs
# pages.yml, whose build job compiles the same deck before deploying it. The
# duplicate costs about two minutes and buys a named check that fails on the
# deck rather than on the publish. Drop the `push` trigger here if that stops
# being worth it; the pull-request trigger is the one that gates.
name: slides

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
      - name: Cache Nix store
        # The Actions cache alone. flakehub-cache-action@v3.21.5 wraps this
        # action at this commit with `use-flakehub: true` fixed, and this
        # repository has no FlakeHub account, so every job logged "Unable to
        # authenticate to FlakeHub". The commit carries no release tag.
        uses: DeterminateSystems/magic-nix-cache-action@76aaf8814cdb385b86597c32b8c51b66b69b0839
        with:
          use-flakehub: false
          use-gha-cache: true
      - name: Install the exobrain CLI of the pinned exobrain-tech tag
        # The justfile checks its host tools with `exobrain host-check` before
        # any recipe runs, and the devshell holds no exobrain, so this job
        # installs the CLI as ci.yml does. scripts/check-ci-host-tools fails a
        # job that calls `just` without this step.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(yq '.repos[] | select(.repo | test("/exobrain-tech(\.git)?/?$")) | .rev' .pre-commit-config.yaml)
          asset=exobrain-x86_64-unknown-linux-gnu.tar.xz
          gh release download "$tag" --repo gubasso/exobrain-tech --pattern "$asset" --dir "$RUNNER_TEMP"
          gh attestation verify "$RUNNER_TEMP/$asset" --repo gubasso/exobrain-tech
          mkdir -p "$RUNNER_TEMP/exobrain"
          tar -xJf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP/exobrain" --strip-components=1
          echo "$RUNNER_TEMP/exobrain" >> "$GITHUB_PATH"
      - name: Install deck dependencies
        run: nix develop --command just slides-install
      - name: Build deck
        run: nix develop --command just slides-build
