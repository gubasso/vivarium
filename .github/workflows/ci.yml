# CI workflow — the lanes a runner can serve, plus the gate a merge rests on.
#
# Every job here invokes a pre-commit hook by id and never repeats its command.
# `.pre-commit-config.yaml` is where a lane's command is written, so this file,
# the `just` recipes, and the git hooks cannot drift: they name the same thing.
# The lane register is docs/reference/testing-lanes.md.
#
# Trigger: `master` and every pull request. The release convention writes the
# trunk through squash-merged pull requests alone and arms the release request
# from the moment it opens, so a merge that nothing gated would ship itself.
# The pull-request trigger is what makes the `gate` job below reportable, and
# `gate` is the one check the trunk's protection requires.
#
# The deck still has its own lane in slides.yml. A change to the presentation
# tree runs both lanes on a request; that overlap is the price of one gate.
name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A runner has no external drive, and every recipe and hook that compiles or
# boots is gated on one (ADR-0106). This is the escape, stated once for the
# workflow: run here, on the runner's own disk. Deliberately explicit rather
# than having the gate detect CI for itself — a gate that decides it is
# somewhere special is one nobody can reason about from the outside, and the
# capacity check still runs, so a runner that is genuinely out of room still
# refuses instead of failing mid-write.
#
# Which is why each step below reaches `heavy-run` before `nix develop` rather
# than through it. `nix develop` realises the development environment into the
# store, so a gate placed inside it measures a store the step has already
# written to, and the refusal above would arrive after the write it exists to
# prevent. Outside, the step needs only the runner's own `bash` and coreutils.
env:
  VIVARIUM_HEAVY_ON_HOST: '1'
  # The hooks that gate a push and that no runner runs, each with its reason.
  # `scripts/check-lane-register` reads this list and fails a push-staged hook
  # that appears neither here nor in the `check` matrix below, so a check that
  # quietly stops running in CI cannot exist unremarked.
  #
  #   test-boot            needs a systemd user manager, which a runner has not
  #                        been shown to offer; the `boot-experiment` job below
  #                        is what would change that
  #   slidev-build         slides.yml is the deck's own lane and installs the
  #                        deck's dependencies, which this workflow never does
  #   leftovers            reports what a round left on this developer's two
  #                        disks; a runner is discarded after the run
  #   rk-no-push-to-trunk  judges the push a developer is making; the forge's
  #   rk-no-hand-authored-tag  own trunk and tag protection is what says the
  #                        same thing to a runner, and it says it later and
  #                        harder
  NOT_ON_A_RUNNER: 'test-boot slidev-build leftovers rk-no-push-to-trunk rk-no-hand-authored-tag'

jobs:
  # The commit stage over the whole tree, which is what a contributor without
  # hooks installed would otherwise bypass. The autofixing hooks are the real
  # gate: pre-commit fails with "files were modified by this hook", which is
  # exactly the failure such a contributor should see. `fetch-depth: 0` is
  # load-bearing for gitleaks — a shallow clone would let it pass over history
  # it never fetched.
  hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
      - name: Cache Nix store
        uses: DeterminateSystems/flakehub-cache-action@v3.21.5
      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Commit-stage hooks
        # A CI sweep commits nothing and checks out no worktree, so the two
        # hooks that judge where a commit is being made have nothing true to
        # say here. The release convention names this pair itself, in the
        # comment at the top of the landed block.
        env:
          SKIP: no-commit-to-branch,rk-worktree-location
        run: tests/host/heavy-run --need 8 --label "ci commit-stage hooks" -- nix develop --command pre-commit run --all-files --hook-stage pre-commit
      - name: Commit messages
        # The commit-msg stage is the one installed hook type `pre-commit run
        # --all-files` cannot replay — it lints a message, not files — so the
        # `committed` gate gets its own lane over the commits each event
        # proposes, with the same leniency flags the local hook carries. A
        # pull request anchors at its base branch; a push anchors at the
        # ref's previous tip (`github.event.before`), which is all zeros only
        # while the ref is being created — that one push has no anchor and is
        # skipped by name rather than guessed at. A manual run carries no
        # previous tip at all and is skipped the same way. The anchor crosses
        # as an environment variable rather than by interpolation so a ref
        # name is data, not script.
        #
        # The range needs both ends named on a pull request. A request is
        # checked out at the merge commit the forge synthesises, whose message
        # is "Merge <sha> into <sha>" and is nobody's to write, so a range
        # ending at HEAD fails on a commit the author never authored. The
        # request's own head is the last commit this gate judges.
        env:
          RANGE_START: ${{ github.event.pull_request.base.sha || github.event.before }}
          RANGE_END: ${{ github.event.pull_request.head.sha || 'HEAD' }}
        run: |
          if [ -z "$RANGE_START" ] || [ "$RANGE_START" = "0000000000000000000000000000000000000000" ]; then
            echo "no previous tip to anchor a message range; skipping"
            exit 0
          fi
          nix develop --command committed --fixup --wip "${RANGE_START}..${RANGE_END}"

  # Every push-stage hook a runner can serve, one job each.
  #
  # A matrix rather than one job running the push stage whole, because a matrix
  # says which lane failed from the job list alone. It also lets the lanes run
  # beside each other on separate runners, which is the only concurrency a
  # 4-vCPU runner has to offer a suite whose lanes each want the machine.
  #
  # Each entry invokes the hook by id, so the command a runner runs is the
  # command `git push` runs. The id crosses as an environment variable rather
  # than by interpolation, so a matrix value is data and not script.
  check:
    strategy:
      fail-fast: false
      matrix:
        hook:
          - test-unit
          - test-local
          - test-eval
          - test-net
          - test-doc
          - clippy-strict
          - cargo-deny
          - cargo-machete
          - gitleaks
          - product-flake-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # gitleaks reads the whole history and would otherwise pass over what
          # a shallow clone never fetched.
          fetch-depth: 0
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
      - name: Cache Nix store
        uses: DeterminateSystems/flakehub-cache-action@v3.21.5
      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Run the hook
        env:
          HOOK: ${{ matrix.hook }}
        run: tests/host/heavy-run --need 12 --label "ci $HOOK" -- nix develop --command pre-commit run --all-files --hook-stage manual "$HOOK"

  # An experiment, and never a gate: `continue-on-error` and absent from `gate`'s
  # `needs`, so a red here holds no merge.
  #
  # What it is testing is whether a runner can serve the boot lane at all. The
  # premises are unequal. `/dev/kvm` is present and world read-write on a standard
  # runner, which was measured here on 2026-09-08 — the Determinate Nix installer
  # sets `DETERMINATE_NIX_KVM=1` and the device shows `crw-rw-rw- root kvm`. A
  # systemd user manager is the premise that has never been shown, and ADR-0097
  # gives a VM's lifetime to a transient user unit, so no amount of KVM substitutes
  # for it. The step below arranges lingering and reports what it found before
  # spending a boot on the question.
  #
  # What would promote this job into the gate: the user-manager premise verified
  # here, and two consecutive green runs. One clean run is evidence of possibility,
  # not of reliability. Until then `test-boot` stays in HOST_ONLY above, the
  # developer's own `git push` is where the boot lane gates, and this job's
  # outcome is recorded in docs/reference/tracking.yaml.
  boot-experiment:
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
      - name: Cache Nix store
        uses: DeterminateSystems/flakehub-cache-action@v3.21.5
      - name: What this runner offers a booting guest
        # Reported before the lane runs, so a failure below can be read against
        # what was actually available rather than against an assumption.
        run: |
          set -u
          ls -l /dev/kvm || echo "no /dev/kvm"
          sudo loginctl enable-linger "$USER" || echo "enable-linger refused"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          systemctl --user show -p Version --value || echo "no systemd user manager"
      - name: The boot lane
        run: tests/host/heavy-run --need 12 --label "ci test-boot" -- nix develop --command pre-commit run --all-files --hook-stage manual test-boot

  # The artifact workflow's proof. It runs `dist plan` and not `dist generate`:
  # dist-workspace.toml sets allow-dirty = ["ci"] because release.yml is
  # generated and then hardened by hand, so a generate-and-diff check would
  # fail on the hardening itself. The obligation that replaces it — diff the
  # generated form by hand on every cargo-dist-version bump — lives in
  # docs/reference/tracking.yaml with its cadence.
  dist-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install dist at the configured pin
        # The pin is read from the file rather than written here, so a
        # cargo-dist-version bump moves this job with it. An empty read is a
        # loud failure, not a silently wrong version.
        run: |
          set -euo pipefail
          pin="$(grep -m1 '^cargo-dist-version' dist-workspace.toml | cut -d'"' -f2)"
          [ -n "$pin" ] || { echo "dist-workspace.toml names no cargo-dist-version"; exit 1; }
          curl --proto '=https' --tlsv1.2 -LsSf \
            "https://github.com/axodotdev/cargo-dist/releases/download/v$pin/cargo-dist-installer.sh" | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "DIST_PIN=$pin" >> "$GITHUB_ENV"
      - name: dist runs at the configured pin
        run: dist --version | grep -Fq "$DIST_PIN"
      - name: The configuration produces a viable release
        run: dist plan

  # The one check the trunk's protection requires. `needs` resolves inside one
  # workflow file, so every proof a merge rests on is a job of this file and a
  # member of this list. A job left out still reports and holds nothing —
  # `boot-experiment` is left out on purpose, and the comment on it says why.
  #
  # `if: always()` is load-bearing: the forge reports a job skipped by a failed
  # dependency as success, so a gate that only ran on success would go green on
  # a red pipeline.
  gate:
    if: always()
    needs: [hooks, check, dist-plan]
    runs-on: ubuntu-latest
    steps:
      - name: Every job succeeded
        env:
          RESULTS: ${{ toJson(needs) }}
        run: |
          set -eu
          bad="$(printf '%s' "$RESULTS" |
            jq -r 'to_entries[] | select(.value.result != "success") | "\(.key) reported \(.value.result)"')"
          [ -z "$bad" ] || { echo "$bad"; exit 1; }
