# CI workflow — lint, test, build.
# Every job reuses the project's Nix devshell (flake.nix) so CI runs the exact
# toolchain pinned in rust-toolchain.toml, the same one local development uses:
# `nix develop --command <task>`.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
      - name: Cache Nix store
        uses: DeterminateSystems/flakehub-cache-action@v3.21.5
      - name: Format
        run: nix develop --command cargo fmt --all --check
      - name: Clippy
        run: nix develop --command cargo clippy --all-targets --all-features -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
      - name: Cache Nix store
        uses: DeterminateSystems/flakehub-cache-action@v3.21.5
      - name: Test
        run: nix develop --command cargo nextest run --all-features

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
      - name: Cache Nix store
        uses: DeterminateSystems/flakehub-cache-action@v3.21.5
      - name: Build
        run: nix develop --command cargo build --release
