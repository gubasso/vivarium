# CI workflow — lint, test, build, hooks.
# Every job reuses the project's Nix devshell (flake.nix) so CI runs the exact
# toolchain pinned in rust-toolchain.toml, the same one local development uses.
# Jobs invoke the justfile recipes through the devshell
# (`nix develop --command just <recipe>`) so CI and local runs share one
# definition of each task — the recipes themselves already wrap `cargo`.
#
# The hooks job runs the same pre-commit set the git hooks gate locally, so a
# contributor without hooks installed cannot pass CI without them. The
# autofixing hooks are what make it a real gate here: pre-commit fails with
# "files were modified by this hook", which is exactly the failure such a
# contributor should see. Its `fetch-depth: 0` is load-bearing for gitleaks —
# a shallow clone would let it pass over history it never fetched.
#
# Trigger: `master` only. The deck has its own lane in slides.yml, which runs
# on `develop` and on pull requests, so a change to the presentation tree no
# longer drags the Rust toolchain through a two-minute install to prove
# nothing. What this costs is real and deliberate: nothing between a merge to
# `develop` and a release tag runs lint, test, build, or hooks, so the first
# CI a change meets is after promote-to-master.yml has already advanced
# `master` onto its tag. Restoring pre-merge gating is adding `pull_request:`
# back below.
name: ci

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# A runner has no external drive, and every recipe and hook that compiles or
# boots is gated on one (ADR-0106). This is the escape, stated once for the
# workflow: run here, on the runner's own disk. Deliberately explicit rather
# than having the gate detect CI for itself — a gate that decides it is
# somewhere special is one nobody can reason about from the outside, and the
# capacity check still runs, so a runner that is genuinely out of room still
# refuses instead of failing mid-write.
#
# Which is why each step below reaches `heavy-run` before `nix develop` rather
# than through it. `nix develop` realises the development environment into the
# store, so a gate placed inside it measures a store the step has already
# written to, and the refusal above would arrive after the write it exists to
# prevent. Outside, the step needs only the runner's own `bash` and coreutils.
# The recipes gate themselves again from within; paying for the check twice is
# cheaper than choosing which of the two invocations may skip it.
env:
  VIVARIUM_HEAVY_ON_HOST: '1'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
      - name: Cache Nix store
        uses: DeterminateSystems/flakehub-cache-action@v3.21.5
      - name: Format
        run: tests/host/heavy-run --need 4 --label "ci fmt-check" -- nix develop --command just fmt-check
      - name: Clippy
        run: tests/host/heavy-run --need 4 --label "ci lint" -- nix develop --command just lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
      - name: Cache Nix store
        uses: DeterminateSystems/flakehub-cache-action@v3.21.5
      - name: Test
        run: tests/host/heavy-run --need 12 --label "ci test-ci" -- nix develop --command just test-ci

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
      - name: Cache Nix store
        uses: DeterminateSystems/flakehub-cache-action@v3.21.5
      - name: Build
        run: tests/host/heavy-run --need 4 --label "ci build" -- nix develop --command just build

  hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
      - name: Cache Nix store
        uses: DeterminateSystems/flakehub-cache-action@v3.21.5
      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Hooks
        run: tests/host/heavy-run --need 12 --label "ci hooks" -- nix develop --command just hooks
      - name: Commit messages
        # The commit-msg stage is the one installed hook type `pre-commit run
        # --all-files` cannot replay — it lints a message, not files — so the
        # `committed` gate gets its own lane over the commits each event
        # proposes, with the same leniency flags the local hook carries. A
        # pull request anchors at its base branch; a push anchors at the
        # ref's previous tip (`github.event.before`), which is all zeros only
        # while the ref is being created — that one push has no anchor and is
        # skipped by name rather than guessed at. A manual run carries no
        # previous tip at all and is skipped the same way. The anchor crosses
        # as an environment variable rather than by interpolation so a ref
        # name is data, not script.
        #
        # The pull-request arm this expression used to carry is gone with the
        # `pull_request` trigger: an unreachable branch that still reads as
        # coverage is worse than no branch.
        env:
          RANGE_START: ${{ github.event.before }}
        run: |
          if [ -z "$RANGE_START" ] || [ "$RANGE_START" = "0000000000000000000000000000000000000000" ]; then
            echo "no previous tip to anchor a message range; skipping"
            exit 0
          fi
          nix develop --command committed --fixup --wip "${RANGE_START}..HEAD"
