# promote-to-master — fast-forward `master` onto each release tag.
#
# Branch model: `develop` is the trunk; `master` holds only released commits with
# linear history. When release-plz tags `vX.Y.Z` on `develop`, this workflow
# advances `master` to that exact tag (the canonical release marker), after
# checking the tag is actually reachable from `develop`.
#
# Why a standalone tag-triggered workflow: release-plz pushes the tag under a
# GitHub App token, and an App-token push DOES retrigger tag workflows — so this
# fires automatically (a tag pushed with the default GITHUB_TOKEN would not, which
# is why the promote used to be inlined into release-plz.yml). It runs
# concurrently with the cargo-dist release.yml and is independent of it.
#
# Token: the push to `master` goes out under the GitHub App token (minted below),
# not the default GITHUB_TOKEN. `master` is a protected branch whose only bypass
# actor is this App — and on a personal account the default-token identity
# (`github-actions[bot]`) can never be a ruleset bypass actor, so a default-token
# push would be rejected. Pushing as the App matches the bypass actor and is
# accepted. This workflow does NOT create the GitHub Release — cargo-dist's
# release.yml owns that.
name: promote-to-master

on:
  push:
    tags: ['v*']

# The push to `master` uses the App token (minted in the job), so the default
# GITHUB_TOKEN needs no write scope — checkout and push both authenticate as the
# App. Keep GITHUB_TOKEN read-only as least privilege.
permissions:
  contents: read

jobs:
  promote:
    if: github.repository_owner == 'gubasso'
    runs-on: ubuntu-latest
    steps:
      # Mint the App token so the push to `master` is attributed to the App —
      # the ruleset's bypass actor. (Same App as release-plz.yml.)
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_PLZ_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
          # Scope the token to only what this job uses (the push to `master`).
          # Without this, the token inherits every installation permission the
          # shared App holds (including pull-requests: write).
          permission-contents: write
      - uses: actions/checkout@v7 # zizmor: ignore[artipacked] the later authorized push requires the App checkout credential
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - name: Verify the tag is on develop
        run: |
          # Promotion targets the release TAG, not an arbitrary branch SHA.
          git fetch origin develop
          tag_sha="$(git rev-parse "refs/tags/${GITHUB_REF_NAME}^{commit}")"
          if ! git merge-base --is-ancestor "$tag_sha" origin/develop; then
            echo "::error::tag $GITHUB_REF_NAME ($tag_sha) is not on develop; refusing to promote master." >&2
            exit 1
          fi
      - name: Fast-forward master to the release tag
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          tag_sha="$(git rev-parse "refs/tags/${GITHUB_REF_NAME}^{commit}")"
          if git fetch origin master; then
            git checkout -B master origin/master
            git merge --ff-only "$tag_sha"
          else
            # First release: master does not exist yet — create it at the tag.
            git checkout -B master "$tag_sha"
          fi
          git push origin master
