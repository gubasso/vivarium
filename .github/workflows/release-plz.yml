# release-plz — automated crates.io publishing and release PRs.
#
# Branch model: `develop` is the trunk (and the GitHub default branch); `master`
# holds only released commits. This workflow runs on `develop`: release-plz opens
# the release PR and, when that PR merges, tags + publishes. Fast-forwarding
# `master` onto that exact release tag is handled separately by the tag-triggered
# promote-to-master.yml workflow (kept out of this file on purpose).
#
# Publishing uses crates.io Trusted Publishing (OIDC): release-plz mints its own
# short-lived registry token from the `id-token: write` permission below, so NO
# CARGO_REGISTRY_TOKEN secret and NO separate auth action are required.
#
# Prerequisites:
#   - Set the GitHub default branch to `develop` (release-plz bases the release PR
#     on the default branch).
#   - Configure Trusted Publishing for this crate on crates.io (Settings ->
#     Trusted Publishing), pointing at this repo + this workflow filename.
#   - The FIRST publish of a brand-new crate cannot use Trusted Publishing; run
#     `cargo publish` once manually with a token, then let release-plz take over.
#   - Create a GitHub App (contents + pull-requests: write), install it on this
#     repo, and store its App ID and private key as the RELEASE_PLZ_APP_ID and
#     RELEASE_PLZ_APP_PRIVATE_KEY secrets. release-plz runs with that App token so
#     its tag push retriggers the tag-triggered workflows — both the cargo-dist
#     release.yml (binaries) and promote-to-master.yml (master fast-forward). A tag
#     pushed with the default GITHUB_TOKEN would not retrigger either.
#
# Binary distribution is handled separately by dist's own release workflow
# (generated via `dist generate` from dist-workspace.toml); it is tag-triggered
# off the tag release-plz creates, and intentionally NOT merged into this file.
name: release-plz

on:
  push:
    branches: [develop]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-plz:
    if: github.repository_owner == 'gubasso'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
      - name: Cache Nix store
        uses: DeterminateSystems/flakehub-cache-action@v3.21.5
      # Mint a GitHub App token so release-plz's tag push retriggers tag
      # workflows (cargo-dist's release.yml + promote-to-master.yml); the default
      # GITHUB_TOKEN would not.
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_PLZ_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Run release-plz
        id: release-plz
        uses: release-plz/action@v0.5
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
