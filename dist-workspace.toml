[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.34.0"
# CI backends to support
ci = "github"
# The installers to generate for each app. A homebrew installer would need
# a tap repository plus a HOMEBREW_TAP_TOKEN secret; the shell installer and
# cargo-binstall cover every target without that infrastructure.
installers = ["shell"]
# Target platforms to build apps for (Rust target-triple syntax). vivarium
# runs only on Linux: it boots its guests behind KVM, and the code uses
# Linux-only interfaces, so a macOS or Windows target does not compile.
targets = ["aarch64-unknown-linux-gnu", "x86_64-unknown-linux-gnu"]
# Which actions to run on pull requests. Skip, because the forge resolves a
# job's needs inside one workflow file: the trunk protection requires one
# project-owned check beside the landed pr-title check, so a plan job here
# reports a status nothing holds and a red one merges anyway. The proofs move
# into the project's own gated workflow, which the required check needs, and
# the rust binding carries the job.
pr-run-mode = "skip"
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false
# Sign every built artifact with a GitHub Artifact Attestation, so a consumer
# can check which workflow and commit produced it. crates.io stores no
# provenance, so the release page is the only place it can live.
github-attestations = true
# Attest in the host phase, not the default build phase. The default attests
# only the per-platform archives; the installers a consumer actually curls are
# global artifacts built later, and the host phase is the first point where
# every file that will reach the release page exists in one place.
github-attestations-phase = "host"
# The host phase's permissions are job-scoped, so the release must be created
# in the same phase; cargo-dist's documentation asks for this pairing outright.
github-release = "host"
# `.github/workflows/release.yml` is generated from this file and committed
# exactly as `dist generate` writes it, so `dist plan` in CI fails when the two
# drift. The generated form fails zizmor, which therefore stays out of this
# project's checks until cargo-dist fixes its template: KI-0003 in
# docs/reference/known-issues/ owns the case and the return trigger.

# The host binaries alone, on every target. The guest agent is a binary of the
# same package behind its `guest` feature, and the build runs the default
# features, so cargo never builds it here. dist still lists every binary target
# the package declares, so the list is named per target.
[dist.binaries]
aarch64-unknown-linux-gnu = ["viv", "vivarium-supervisor"]
x86_64-unknown-linux-gnu = ["viv", "vivarium-supervisor"]

# The build that signs is itself pinned by digest: cargo-dist references
# these actions by movable tag unless told otherwise, and the attest step
# is among them, so a moved tag could swap the code that mints the
# signature. The commit is the immutable execution reference; the tag it
# came from stays readable in the registry, as the discovery ref a
# freshness check reads. These are dist's own default versions, which are
# not the tags the hand-written workflows pin.
[dist.github-action-commits]
"actions/checkout" = "d23441a48e516b6c34aea4fa41551a30e30af803"          # v6
"actions/download-artifact" = "3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c" # v8
"actions/upload-artifact" = "043fb46d1a93c77aae656e7c1c64a875d1fc6a0a"   # v7
"actions/attest" = "1e69f48acb82d1966a394da916b4c1698aa569d6"            # v4
