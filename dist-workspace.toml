# cargo-dist / dist configuration. See https://axodotdev.github.io/cargo-dist for
# all options. Included only when this project ships prebuilt binaries, installers,
# or GitHub-release artifacts; it is separate from crates.io library publishing.
[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false
# `.github/workflows/release.yml` is hand-maintained and dist must not compare
# against or regenerate it. The generated form leaves `$RUNNER_TEMP/notes.txt`
# unquoted and word-splits `$PRERELEASE_FLAG`; the committed form quotes the
# path and expands the flag as an array. Without this key dist's `plan` job
# fails on every run, and the only other exit is to accept the unquoted form
# back — which is a shell-injection shape, not a formatting preference.
#
# The cost is that dist no longer ports its own upgrades into that file, so a
# change to `cargo-dist-version` above means diffing the generated workflow by
# hand. `docs/reference/tracking.yaml` carries that obligation with a cadence.
allow-dirty = ["ci"]
