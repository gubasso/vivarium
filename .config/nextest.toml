# cargo-nextest configuration: profiles for layered testing.
#
# Place this file at `.config/nextest.toml` in the repo root.
# Reference: https://nexte.st/docs/configuration/reference/
#
# Output settings are tuned for token-efficient runs (AI coding agents,
# CI logs): passing tests do not dump stdout/stderr; only failures and
# the final summary appear. The relevant knobs are `status-level`,
# `final-status-level`, `success-output`, and `failure-output`; see the
# config reference above for valid values and trade-offs.
#
# IMPORTANT: every non-default profile is dead config unless the
# invoking command passes `--profile <name>`. Wire pre-commit hooks
# with `--profile pre-commit`, pre-push with `--profile pre-push`,
# and CI with `--profile ci`.

# A booting trial costs a guest kernel, a VMM, one virtiofsd per share, and
# often a guest-closure realisation before any of that. The product lets a
# user run as many project VMs as they like — capacity is checked at launch
# and, above the minimum reserve, reported rather than enforced (N23,
# spec/17). An unattended run has nobody to read that warning and decide, so
# the harness needs the bound the product deliberately does not impose.
#
# `1` since 2026-08-13, and the sweep the previous value asked for is why.
# It was `2`, argued as keeping the concurrency these trials exercise while
# staying under a host that showed roughly 8 GiB available with three guests
# live — and recorded as provisional, because one clean run at a width is
# evidence of possibility rather than of reliability.
#
# The repeated run disagreed with it. At `2`, `profile.pre-push` failed
# intermittently and not always on the same trial: three failures in one run,
# two in the next, one in a third, every one of them `viv start` answering
# `69` because the supervisor did not report readiness within its budget.
# Reproduced with slice 014's new trial excluded, so the width was already
# short of reliable and an added boot trial only made it likelier to show.
#
# The bound the group applies is boots, and the pressure is not only boots:
# this binary's evaluating trials realise guest closures beside them, and the
# comment on the slow-timeout override below already records one that passes
# in 40s alone and exceeds 120s next to two booting guests. Narrowing the
# boots is the lever this file has for that; it does not have one for the
# rest.
#
# It costs nothing measurable. At `1`, two consecutive `pre-push` runs passed
# 24 of 24 in 247s and 263s, against 231–257s for the flaky runs at `2` — the
# serialised boots overlap the evaluating trials instead of each other. The
# concurrency argument for `2` was real and is simply outweighed: a stage
# that fails for a reason unrelated to the change under test is a stage that
# gets pushed past, which is the cost this whole section exists to avoid.
#
# `num-cpus` would be the wrong shape even where nextest accepts it. The
# scarce resource here is host memory and store space; logical CPU count
# tracks neither.
[test-groups]
boot = { max-threads = 1 }

[profile.default]
# Sane defaults for ad-hoc `cargo nextest run`.
# `success-output = "never"` is the nextest default but is set explicitly
# here as a guard against future upstream changes.
status-level = "pass"
final-status-level = "fail"
success-output = "never"
failure-output = "immediate-final"
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 2 }

# The membership list is exact names, not a name pattern, because a pattern
# fails open: a trial the pattern misses does not error, it just runs outside
# the group. `harness_self_check` regenerates this string from the harness's
# own gate table and fails when the two disagree, so adding, renaming, or
# regrading a trial cannot silently widen the bound. That check needs no
# `/dev/kvm`, which is the vantage point where such a mistake would otherwise
# go unseen.
#
# Declared on `default` alone: nextest falls back to `profile.default`'s
# overrides for a setting the active profile's own overrides do not
# configure, so `pre-push` and `ci` inherit this. Verified with
# `cargo nextest show-config test-groups --profile <name>` rather than
# assumed.
[[profile.default.overrides]]
filter = 'test(=workflow_01_first_time_bind_boot) + test(=workflow_02_identity_collision_suffix) + test(=workflow_05_restrict_egress_allowlist) + test(=workflow_06_exec_exit_code_propagation) + test(=workflow_06_shell_interactive_session) + test(=workflow_07_stop_restart_preserving_volumes) + test(=workflow_07_stop_completes_within_budget) + test(=workflow_08_destroy_cold_rebuild) + test(=workflow_09_workspace_round_trip)'
test-group = "boot"

# The acceptance binary's own clock. Its trials evaluate a manifest through Nix, build a guest
# closure, and boot a microVM before they assert anything, and the profile-wide 120s ceiling was
# sized for trials that do none of that. Two failures measured it: a booting trial killed with
# `(test timed out)` and no account of where it got to — which reads as a hang in the product and
# was a boot that had not finished — and an evaluating trial that passes in 40s alone and exceeded
# 120s while two guests were booting beside it.
#
# The group above bounds how many trials may boot at once; it cannot bound what an evaluating trial
# competes with, because the scarce resource is the host's CPU and store rather than the guest
# count. So the clock is widened for the binary rather than the width narrowed further, which would
# discard the concurrency the group deliberately keeps.
[[profile.default.overrides]]
filter = 'binary(user_workflows)'
slow-timeout = { period = "120s", terminate-after = 3 }

# Unit-test lane. Unit tests run at BOTH `pre-commit` (gate every commit)
# and `pre-push` (gate every push — guards against rebases/amends bypassing
# pre-commit).
#
# `kind(lib)` matches unit tests in library crates; `kind(bin)` matches
# unit tests inside `[[bin]]` targets (binary-only crates with no [lib]).
[profile.pre-commit]
default-filter = "kind(lib) + kind(bin)"
fail-fast = true
slow-timeout = { period = "30s", terminate-after = 2 }
status-level = "fail"
final-status-level = "fail"
success-output = "never"
failure-output = "immediate-final"

# Integration-test lane: tests/*.rs (kind=test). Wired to the `pre-push`
# stage. These test the seams between components — argv contracts, config
# layering, error surfacing — typically with the boundary stubbed or
# faked. `kind(test)` matches every separate test binary Cargo compiles
# from tests/*.rs.
#
# One named acceptance trial is subtracted, and nothing else. It waits on a verb
# a later slice implements, so on a capable host it fails by construction rather
# than by defect: `workflow_05` needs the egress allowlist (slice 004).
#
# This began as `- binary(user_workflows)`, which was the same statement made
# bluntly: acceptance is informational, and it gates the host runbooks and CI
# rather than a developer's push. The cost of subtracting the whole binary was
# never the reds — it was the trials passing beside them going unread. Slice 013
# narrowed it to three named trials by landing `viv exec` and `viv shell`, and
# slice 014 narrowed it to this one by landing `viv volume list`, `viv volume
# prune`, and `viv destroy`. That is the step `docs/plan/sequencing.md` requires
# of every slice that greens a trial: moving a row without restoring the gate
# would leave the gate off, and the gate reports the same green either way.
#
# Subtracted rather than ignored per-trial, because an `#[ignore]` is a knob
# whose removal nothing enforces. Slice 004 removes the last clause and returns
# this to plain `kind(test)`.
#
# `profile.ci` deliberately does not inherit this: CI runs everything.
#
# Ignored trials are hidden by `cargo nextest list`; pass
# `--run-ignored=all` to see them. If all matching trials are ignored,
# nextest exits 4, so `harness_self_check` must remain ungated. At nextest
# 0.9.138, `no-tests` is not a profile key; only `--no-tests=pass` is valid.
#
# `fail-fast` is off so a single failure does not hide other regressions.
[profile.pre-push]
default-filter = "kind(test) - test(=workflow_05_restrict_egress_allowlist)"
fail-fast = false
slow-timeout = { period = "120s", terminate-after = 2 }
status-level = "fail"
final-status-level = "fail"
success-output = "never"
failure-output = "immediate-final"

# CI lane: everything, with retry tolerance for known-flaky network tests.
#
# `status-level = "fail"` (not "pass"): in CI logs, per-test pass lines
# are noise — they multiply output tokens without adding signal for
# humans triaging a failure or for AI agents parsing the run. The final
# roll-up still surfaces failures via `final-status-level = "fail"`.
# Ref: https://nexte.st/docs/configuration/reference/ (status-level)
#
# Progress bars auto-disable on non-TTY runners (e.g. GitHub Actions).
# If a runner emulates a TTY, set `NEXTEST_HIDE_PROGRESS_BAR=1` in the
# workflow env — progress redraws bloat captured logs that agents later
# read.
# Ref: https://nexte.st/docs/running/
[profile.ci]
fail-fast = false
slow-timeout = { period = "180s", terminate-after = 2 }
retries = { backoff = "exponential", count = 2, delay = "1s", max-delay = "10s", jitter = true }
status-level = "fail"
final-status-level = "fail"
success-output = "never"
failure-output = "immediate-final"
