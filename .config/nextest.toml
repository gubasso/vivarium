# cargo-nextest configuration: one profile per lane.
#
# Reference: https://nexte.st/docs/configuration/reference/
#
# A profile is dead config unless something passes `--profile <name>`, and the
# only thing that does is `.pre-commit-config.yaml`, which is where a lane's
# command is written. `just` and CI invoke hooks by id rather than repeating a
# command, so the three cannot drift. The register is
# `docs/reference/testing-lanes.md`.
#
# Output is tuned for runs a person or an agent reads afterwards: a passing test
# dumps nothing, and only failures and the final roll-up appear. The knobs are
# `status-level`, `final-status-level`, `success-output`, and `failure-output`.

# A booting trial costs a guest kernel, a VMM, one virtiofsd per share, and
# often a guest-closure realisation before any of that. The product lets a
# user run as many project VMs as they like — capacity is checked at launch
# and, above the minimum reserve, reported rather than enforced (N23,
# spec/17). An unattended run has nobody to read that warning and decide, so
# the harness needs the bound the product deliberately does not impose.
#
# `1` since 2026-08-13, and the sweep the previous value asked for is why.
# It was `2`, argued as keeping the concurrency these trials exercise while
# staying under a host that showed roughly 8 GiB available with three guests
# live — and recorded as provisional, because one clean run at a width is
# evidence of possibility rather than of reliability.
#
# The repeated run disagreed with it. At `2`, `profile.pre-push` failed
# intermittently and not always on the same trial: three failures in one run,
# two in the next, one in a third, every one of them `viv start` answering
# `69` because the supervisor did not report readiness within its budget.
# Reproduced with slice 014's new trial excluded, so the width was already
# short of reliable and an added boot trial only made it likelier to show.
#
# The bound the group applies is boots, and the pressure is not only boots:
# this binary's evaluating trials realise guest closures beside them, and the
# comment on the slow-timeout override below already records one that passes
# in 40s alone and exceeds 120s next to two booting guests. Narrowing the
# boots is the lever this file has for that; it does not have one for the
# rest.
#
# It costs nothing measurable. At `1`, two consecutive `pre-push` runs passed
# 24 of 24 in 247s and 263s, against 231–257s for the flaky runs at `2` — the
# serialised boots overlap the evaluating trials instead of each other. The
# concurrency argument for `2` was real and is simply outweighed: a stage
# that fails for a reason unrelated to the change under test is a stage that
# gets pushed past, which is the cost this whole section exists to avoid.
#
# `num-cpus` would be the wrong shape even where nextest accepts it. The
# scarce resource here is host memory and store space; logical CPU count
# tracks neither.
#
# `1` narrows this failure and does not close it, which is worth stating here
# rather than leaving the paragraph above to read as a fix. Measured 2026-08-13
# on the same host, same profile, same commit: five runs, four green at 409s to
# 456s and one that lost `workflow_01_manifest_workspace_resolution_boot` to `viv start`
# answering `69`. The supervisor's own journal named the rung —
# `timed out waiting for guest agent`, so the VM was up and the agent had not
# answered inside its budget — and the host was at a load average of 5.9 with
# 6 GiB of 30 available, after a session of guest builds. That is the pressure
# the paragraph above says this file has no lever for, arriving from outside
# the run rather than from the boots inside it.
#
# A correction, 2026-08-14, after the failure reproduced twice more under the
# same pressure: the budget that expires is not the launcher's 30s. The
# supervisor's own agent-startup budget (`src/launch/supervisor.rs`) fires
# first — both failed runs show the supervisor exiting at ~18.5s wall while
# the launcher goes on to report its 30s — so an earlier version of this
# paragraph argued about the wrong constant. The load-pressure half of that
# argument survives the correction: no budget repairs a host at load 6 with
# 6 GiB of 30 free, and this file still has no lever for it. The margin half
# does not survive: a successful boot takes ~8.5s wall, and "a guest that
# needs longer would be a defect worth seeing" is a fair claim at a 3.5x
# margin, not at the ~1.2x the agent budget then allowed. The budget's own
# sizing lives beside the constant it names. Recorded so the next red is read
# as this and not as the change under test.
[test-groups]
boot = { max-threads = 1 }

# --- The lanes ------------------------------------------------------------
#
# One profile per lane, and each one selects by binary name because that is the
# only tag nextest offers: there is no test attribute to filter on, so the lane a
# test belongs to is spelled in the file name that compiles it. `Cargo.toml` owns
# the naming rule and `scripts/check-lane-register` enforces it.
#
# What a lane needs of its host is the binary's own preflight
# (`tests/support/preflight.rs`), asked once in `main`. Nothing here decides
# whether a test may run — a profile decides only which tests are selected, and
# an unmet need is a red with a reason rather than a silent skip.
#
# No profile carries `retries`. A retry turns an intermittent failure into a
# green run, which is the opposite of what this repository's own rule asks for:
# one clean run is evidence of possibility, not of reliability. The place that
# wants a repeated observation runs the lane twice and says so.

# The ad hoc `cargo nextest run` with no profile: everything that needs nothing.
# A contributor who types the bare command gets a real answer rather than a wall
# of failures from lanes their laptop was never going to serve.
[profile.default]
default-filter = "kind(lib) + kind(bin) + binary(local_*)"
status-level = "pass"
final-status-level = "fail"
success-output = "never"
failure-output = "immediate-final"
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 2 }

# The boot bound, applied to the binary rather than to a list of names.
#
# Its predecessor listed all twenty-six trials exactly, and a self-check in the
# harness regenerated that list so the two could not drift. The binary name does
# the same job by construction: a trial added to `boot_workflows.rs` is inside
# the bound the moment it compiles, and one that belongs here but was written
# into another lane fails on a host without `/dev/kvm` rather than running
# unbounded. `boot_guest_agent` joins the group, which it always should have.
#
# Declared on `default` alone: nextest falls back to `profile.default`'s
# overrides for a setting the active profile's own overrides do not configure,
# so every profile below inherits this. Verified with
# `cargo nextest show-config test-groups --profile <name>` rather than assumed.
[[profile.default.overrides]]
filter = 'binary(boot_*)'
test-group = "boot"
slow-timeout = { period = "120s", terminate-after = 3 }

# The evaluating lane's own clock. Its trials evaluate a manifest through Nix and
# realise a guest closure before they assert anything, and the profile-wide 60s
# ceiling was sized for trials that do none of that. Measured: a trial that
# passes in 40s alone exceeded 120s beside two booting guests.
[[profile.default.overrides]]
filter = 'binary(eval_*)'
slow-timeout = { period = "120s", terminate-after = 3 }

# Needs nothing. Runs at every place, including the commit stage.
[profile.unit]
default-filter = "kind(lib) + kind(bin)"
fail-fast = true
slow-timeout = { period = "30s", terminate-after = 2 }
status-level = "fail"
final-status-level = "fail"
success-output = "never"
failure-output = "immediate-final"

# Needs the built `viv` and a filesystem.
[profile.local]
default-filter = "binary(local_*)"
fail-fast = false
status-level = "fail"
final-status-level = "fail"
success-output = "never"
failure-output = "immediate-final"

# Needs `nix` on PATH.
[profile.eval]
default-filter = "binary(eval_*)"
fail-fast = false
status-level = "fail"
final-status-level = "fail"
success-output = "never"
failure-output = "immediate-final"

# Needs the namespace tools and a creatable unprivileged user+net pair.
[profile.net]
default-filter = "binary(net_*)"
fail-fast = false
status-level = "fail"
final-status-level = "fail"
success-output = "never"
failure-output = "immediate-final"

# Needs `/dev/kvm`, a systemd user manager, `XDG_RUNTIME_DIR`, and Nix.
[profile.boot]
default-filter = "binary(boot_*)"
fail-fast = false
status-level = "fail"
final-status-level = "fail"
success-output = "never"
failure-output = "immediate-final"
