[package]
name = "vivarium"
version = "0.1.0"
edition = "2024"
description = "Nix-native tool that boots each project inside its own microVM, composed from reusable images and config pieces unified by a single manifest."
license = "MIT"
repository = "https://github.com/gubasso/vivarium"
readme = "README.md"
exclude = [
  "/docs",
  "/.github",
  "/scripts",
  "/tests/nix",
  "/tests/host",
  "/deny.toml",
  "/release-plz.toml",
  "/dist-workspace.toml",
  "/flake.nix",
  "/flake.lock",
  "/.envrc",
  "/.editorconfig",
  "/CLAUDE.md",
  "/AGENTS.md",
  "/rust-toolchain.toml",
  "/.pre-commit-config.yaml",
  "/justfile",
]
keywords = ["nix", "microvm", "isolation", "sandbox", "devenv"]
categories = ["command-line-utilities", "virtualization", "development-tools"]
authors = ["Gustavo Basso <gu@gubasso.xyz>"]

[workspace]
resolver = "3"
members = ["crates/vivarium-guest-agent"]

[features]
default = ["host"]
host = [
  "dep:tokio-util",
  "dep:hickory-proto",
  "dep:nftables",
  "dep:ipnet",
  "dep:cliclack",
  "dep:console",
  "dep:indicatif",
]

# The published crate is `vivarium`; the installed command is `viv`.
[[bin]]
name = "viv"
path = "src/main.rs"
required-features = ["host"]

[[bin]]
name = "vivarium-supervisor"
path = "src/bin/vivarium-supervisor.rs"
required-features = ["host"]

[[test]]
name = "user_workflows"
path = "tests/user_workflows.rs"
harness = false

# The guest-agent lane decides at run time whether this host can boot a guest, which the
# built-in harness's static `#[ignore]` cannot express: it has to report why it skipped.
[[test]]
name = "guest_agent_host"
path = "tests/guest_agent_host.rs"
harness = false

# The networking-seams lane gates the same way: on the pinned tools being present and
# unprivileged user+net namespaces being creatable, decided at run time with the reason
# reported.
[[test]]
name = "net_host"
path = "tests/net_host.rs"
harness = false

[dependencies]
# The stderr face ADR-0103 selects: the step/log/note house style over `indicatif` and `console`,
# writing to stderr, restyled through its `Theme` trait. The only module that knows its shape is
# `src/ui/theme.rs`.
cliclack = { version = "0.5.6", optional = true }
# Styling for the stdout result face and the diagnostic palette. Always applied through
# `force_styling` so the first-party `NO_COLOR > FORCE_COLOR > isatty` chain in `src/ui/chain.rs`
# is the one deciding — never this crate's own global detection.
console = { version = "0.16.4", optional = true }
# The three networking seams Q-005 selected; the slice 004 `Revisions` line carries the evidence.
# `hickory-proto` is wire parsing and serialization only — the gating resolver's serve loop is
# vivarium's own, because the release-after-programming ordering is the contract and a server
# framework owns answer release exactly where the gate must sit. No `hickory-resolver`: its cache
# would release answers no filter rule was programmed for.
hickory-proto = { version = "0.26.1", optional = true }
# The animation under the stderr face: `cliclack` builds on it but does not re-export the
# `suspend` seam `src/ui/watch.rs` needs to interleave streamed child stderr with a live spinner.
indicatif = { version = "0.18.6", optional = true }
# CIDR entries in `egress.allow` (spec/03 grammar); matching a literal address against a block.
ipnet = { version = "2.12.1", optional = true }
# Typed model of the libnftables JSON schema. Rulesets are rendered as JSON and applied through
# the pinned `nft` binary, so the parser trusted with guest-driven data is nftables' own userland.
nftables = { version = "0.6.3", optional = true }
# `process` for the two host facts the lifecycle verbs need and cannot be given: the invoking
# user's uid/gid, which the share identity translation maps, and whether the recorded VM pid is
# still alive, which is half of ADR-0030's state discriminator.
# `termios` for the host end of an interactive session: `viv shell` puts the local terminal in raw
# mode so the guest's own line discipline raises the interrupt, and reads the window size to send
# before the guest process starts. The crate is already here and the workspace forbids `unsafe`, so
# a safe binding is the only route to either.
rustix = { version = "1.1.4", features = ["fs", "mount", "process", "termios"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.17"
tokio = { version = "1.49.0", features = [
  "fs",
  # `io-std` for the session verbs: guest output maps raw onto the host's own stdout and stderr,
  # and guest stdin stays attached to the host's (spec/12, ADR-0015).
  "io-std",
  "io-util",
  "macros",
  "net",
  "process",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tokio-util = { version = "0.7.18", features = ["rt"], optional = true }
toml = "1.1.4"

[lints]
workspace = true

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
todo = "deny"
dbg_macro = "deny"
unimplemented = "deny"
panic = "deny"
wildcard_imports = "deny"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[dev-dependencies]
libtest-mimic = "0.8.2"
# The acceptance harness runs `viv` with its output captured and no terminal, which is the right
# shape for every verb but one: `viv shell` hands the terminal to a guest shell, so proving it works
# means giving the child a real pty. Already in this workspace's lock through the guest agent, which
# allocates the other end of the same kind of device.
pty-process = "0.5.3"
serde_json = "1.0.151"
