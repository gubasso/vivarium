[package]
name = "vivarium"
version = "0.1.0"
edition = "2024"
description = "Nix-native tool that boots each project inside its own microVM, composed from reusable images and config pieces unified by a single manifest."
license = "MIT"
repository = "https://github.com/gubasso/vivarium"
readme = "README.md"
exclude = [
  "/docs",
  "/.github",
  "/scripts",
  "/tests/nix",
  "/tests/host",
  "/deny.toml",
  "/release-plz.toml",
  "/dist-workspace.toml",
  "/flake.nix",
  "/flake.lock",
  "/.envrc",
  "/.editorconfig",
  "/CLAUDE.md",
  "/AGENTS.md",
  "/rust-toolchain.toml",
  "/.pre-commit-config.yaml",
  "/justfile",
]
keywords = ["nix", "microvm", "isolation", "sandbox", "devenv"]
categories = ["command-line-utilities", "virtualization", "development-tools"]
authors = ["Gustavo Basso <gu@gubasso.xyz>"]

[workspace]
resolver = "3"
members = ["crates/vivarium-guest-agent"]

[features]
default = ["host"]
host = ["dep:tokio-util"]

# The published crate is `vivarium`; the installed command is `viv`.
[[bin]]
name = "viv"
path = "src/main.rs"
required-features = ["host"]

[[bin]]
name = "vivarium-supervisor"
path = "src/bin/vivarium-supervisor.rs"
required-features = ["host"]

[[test]]
name = "user_workflows"
path = "tests/user_workflows.rs"
harness = false

# The guest-agent lane decides at run time whether this host can boot a guest, which the
# built-in harness's static `#[ignore]` cannot express: it has to report why it skipped.
[[test]]
name = "guest_agent_host"
path = "tests/guest_agent_host.rs"
harness = false

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.17"
tokio = { version = "1.49.0", features = [
  "fs",
  "io-util",
  "macros",
  "net",
  "process",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tokio-util = { version = "0.7.18", features = ["rt"], optional = true }

[lints]
workspace = true

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
todo = "deny"
dbg_macro = "deny"
unimplemented = "deny"
panic = "deny"
wildcard_imports = "deny"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[dev-dependencies]
libtest-mimic = "0.8.2"
serde_json = "1.0.151"
