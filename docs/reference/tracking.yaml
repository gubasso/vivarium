schema: vivarium-tracking-v1
tracked:
  - path: docs/reference/backend-capabilities.md
    last_checked: 2026-08-10
    cadence: 30d and on nix/flake.lock changes
    why: Backend revisions and their accepted interfaces change independently of this repository's prose.
    revalidate: Re-read the exact locked revisions in nix/flake.lock and the linked official upstream sources.
    dependents:
      - docs/plan/slices/001-close-host-measurement-gaps/README.md
      - docs/plan/slices/002-secure-launch-and-supervision/README.md
      - docs/plan/slices/004-enforce-egress-allowlist/README.md
      - docs/plan/slices/007-build-test-lanes/README.md
      - docs/plan/slices/009-automate-backend-advisories/README.md
  - path: docs/reference/microvm-verification-harness.md
    last_checked: 2026-08-27
    cadence: 90d and on harness or backend-pin changes
    why: Measurements depend on the harness, backend closure, guest closure, and target host.
    revalidate: Rerun the appropriate evaluation and real-host lanes; never infer a target-host fact from an agent environment.
    dependents:
      - docs/plan/slices/001-close-host-measurement-gaps/README.md
      - docs/explanation/guest-store-and-volumes.md
      - docs/explanation/shared-filesystems.md
      - docs/explanation/resources-and-capacity.md
      - docs/plan/slices/003-guest-agent-and-credential-relay/README.md
      - docs/plan/slices/010-repair-the-host-runbooks/README.md
  - path: docs/reference/comparison/sources.md
    last_checked: 2026-08-25
    cadence: 30d, the shortest of the per-subject cadences that page names
    why: Every verdict is pinned to a commit, a release, or a dated document in a project this repository does not control, and a subject that renames, releases, or gains an engine invalidates rows without touching anything here.
    revalidate: Re-read each subject at a new revision and update the `Verified:` line above its table, then re-derive any row in docs/reference/comparison/README.md the reading moved. Never edit a revision without re-reading; a false date is worse than a stale one.
    dependents:
      - docs/reference/comparison/README.md
      - docs/reference/comparison/feature-sweep.md
      - docs/reference/comparison/scenarios/
      - docs/reference/comparison/walkthroughs.md
  - path: docs/reference/testing-lanes.md
    last_checked: 2026-07-31
    cadence: 90d
    why: The purity lane depends on an experimental Nix derivation JSON interface.
    revalidate: Check nix derivation show -r JSON against the pinned Nix release and its official manual.
    dependents:
      - docs/plan/slices/007-build-test-lanes/README.md
  - path: .github/workflows/release.yml
    last_checked: 2026-09-08
    cadence: on cargo-dist-version changes in dist-workspace.toml
    why: dist-workspace.toml sets allow-dirty = ["ci"], so dist neither regenerates this workflow nor reports it as stale, and its own upgrades stop arriving.
    revalidate: Run dist generate in a scratch copy against the new cargo-dist-version, diff the generated release.yml against the committed one, and port every change by hand except the hardening. The hardening is the env-var indirection replacing five template interpolations in run bodies, the quoted $RUNNER_TEMP/notes.txt and $GITHUB_PATH, the array-expanded $PRERELEASE_FLAG and tag flags, the braced $GITHUB_OUTPUT redirects, and the zizmor ignore comments. Confirm with zizmor --no-progress --offline and actionlint, and with rk status --check for the action pins and the attest step.
    dependents:
      - dist-workspace.toml
      - docs/guides/publishing.md
  - path: docs/guides/publishing.md
    last_checked: 2026-07-31
    cadence: 90d
    why: Registry authentication, release automation, repository settings, and workflow names can drift.
    revalidate: Verify crates.io trusted publishing, release-plz and cargo-dist assumptions, repository settings, and current workflow filenames.
    dependents:
      - SECURITY.md
      - docs/plan/slices/009-automate-backend-advisories/README.md
  - path: .github/workflows/ci.yml
    last_checked: 2026-09-08
    cadence: 30d and on runner-image or Determinate Nix changes
    why: >-
      Two lanes are kept off a runner by a fact about a machine this repository
      does not control, and one probe reads a value that machine reports oddly.
      Measured 2026-09-09 on a standard runner: /dev/kvm present at mode 0666
      with the Determinate installer setting DETERMINATE_NIX_KVM=1, and a systemd
      user manager answering 255.4 after loginctl enable-linger, so neither
      virtualization nor ADR-0097's transient unit is the obstacle. The obstacle
      is the unprivileged user namespace every VM's network needs (spec/05):
      unshare reports "write failed /proc/self/uid_map: Operation not permitted",
      which is Ubuntu's AppArmor policy, and it keeps both test-boot and test-net
      in NOT_ON_A_RUNNER. Separately, nix config show experimental-features
      printed an empty line on that runner in every context while both features
      worked, and nix config show --json reported the same nothing when that was
      tried on 2026-09-09, so src/doctor/host.rs exercises the capability with a
      two-line temporary flake instead of reading the setting alone.
    revalidate: >-
      Read the boot-experiment job of the most recent CI run. Its capability step
      names each premise, including the namespace probe. Two consecutive green
      runs plus the namespace premise held are what promote test-boot and
      test-net out of NOT_ON_A_RUNNER in .github/workflows/ci.yml and into the
      check matrix. A runner image that relaxes the AppArmor policy, or a sysctl
      a step could set, is what would move it. For the doctor probe, read the
      nix-flakes-enabled line of any CI lane that runs viv doctor: it should read
      pass, and "from reading one" is what says the capability arm answered.
      Never infer either premise from an agent environment.
    dependents:
      - docs/reference/testing-lanes.md
      - docs/decisions/ADR-0114-a-lane-runs-where-a-place-names-it.md
      - src/doctor/host.rs
