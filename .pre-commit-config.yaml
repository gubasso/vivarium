# Nix owns runtimes; pre-commit owns hooks.
default_install_hook_types: [pre-commit, commit-msg, pre-push]

# One stage per claim (ADR-0101). Without this line an unstaged hook runs at
# every installed stage, so the whole commit-stage set silently re-ran on
# push. The commit stage owns per-file and autofixing checks; the push stage
# owns whole-history and whole-tree policy, and a hook that rewrites files
# never appears there — a fix applied during `git push` cannot enter the push
# it just failed. A hook belongs at push only via an explicit `stages:` key.
default_stages: [pre-commit]

# Where the bytes go (ADR-0106). Every hook below that compiles, evaluates a
# flake, or boots a guest is invoked through `tests/host/heavy-run`, which
# resolves `VIVARIUM_HEAVY_DRIVE` and binds it into the hook's environment
# before the command starts. Without that, `git push` runs a suite that boots
# microVMs and realises guest closures straight onto the boot disk, and the
# first report is a filesystem at 100% partway through — which is how this
# repository learned it.
#
# The refusal is deterministic here because it has to be: pre-commit runs every
# hook with standard input on `/dev/null`, so a gate at this stage cannot ask.
# No drive means exit `69` and nothing ran, with the escape named. To run on the
# host disk anyway, `VIVARIUM_HEAVY_ON_HOST=1 git push` — a variable rather than
# a flag because git passes no arguments to its hooks.
#
# The hooks that are NOT wrapped are the formatters, the markdown gates, the
# secret scans, `taplo`, `machete` and `deny`. They write kilobytes, and a
# whitespace commit should not need an external drive plugged in.
repos:
  # --- Housekeeping (auto-fix where possible) ---
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Explicit stages on the two fixers: upstream declares
      # `[pre-commit, pre-push, manual]`, which outranks default_stages,
      # and an autofixer never runs at push.
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        stages: [pre-commit]
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: check-added-large-files
        args: ['--maxkb=16384']
      - id: check-case-conflict
      - id: check-merge-conflict
        args: ['--assume-in-merge']
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
      - id: check-xml
      - id: destroyed-symlinks
      # detect-private-key is deliberately absent: its PEM-marker rule is a
      # subset of ripsecrets (commit stage) and gitleaks (push stage, full
      # history), verified 2026-08-14 by planting a throwaway key and
      # confirming both flag it.
      - id: no-commit-to-branch
        args: [--branch, master]
      - id: forbid-submodules

  - repo: https://github.com/maresb/check-json5
    rev: v1.0.1
    hooks:
      - id: check-json5
        exclude: '[-.]lock\.json$'

  # --- JSON / JSONC formatter: dprint (comment-safe autofix) ---
  #
  # dprint's json plugin formats JSON and JSONC (comments + trailing commas),
  # which the stdlib-based pretty-format-json cannot. check-json5 above stays the
  # syntax gate; dprint owns formatting. Config in the sibling `./dprint.json`
  # (plugin version pinned there). `flake.nix` supplies dprint on PATH.
  # pre-commit only — git push
  # may strip PATH, and formatting is already applied by commit time.
  - repo: local
    hooks:
      - id: dprint
        name: dprint fmt (json/jsonc)
        entry: dprint fmt
        language: system
        files: '\.(json|jsonc|json5)$'
        pass_filenames: true
        stages: [pre-commit]

  # --- EditorConfig ---
  - repo: https://github.com/editorconfig-checker/editorconfig-checker
    rev: v3.9.0
    hooks:
      - id: editorconfig-checker
        alias: ec
        args: [-disable-insert-final-newline, '-exclude', 'LICENSE']
        # Markdown is excluded: editorconfig-checker can't parse it — it flags
        # fenced-code-block interiors and the odd-width ordered-list
        # continuations CommonMark/dprint use (e.g. `1. ` -> 3 spaces), and
        # defaults to indent_size=4 even when unset. Markdown formatting is
        # owned by dprint + markdownlint-cli2 when those hooks are layered in.
        exclude: '\.md$'

  # --- Rust: format & lint (auto-fix) ---
  - repo: local
    hooks:
      # Nix supplies these binaries because managed hooks that ship prebuilt
      # ELF wheels cannot execute in the repository's non-FHS environments.
      # Type selectors cover both executable extensionless programs and the
      # co-located `.sh` sources Nix loads.
      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        language: system
        types: [shell]
        require_serial: true
      - id: shfmt
        name: shfmt
        entry: shfmt --write -i 2 -ci -bn
        language: system
        types: [shell]
      - id: ruff-check
        name: ruff check
        entry: ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: ruff format
        language: system
        types_or: [python, pyi]

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint-system

  - repo: local
    hooks:
      # Offline mode keeps this deterministic when no GitHub token is present;
      # repository policy still accepts immutable release/tag references.
      - id: zizmor
        name: zizmor (GitHub Actions security)
        entry: zizmor --no-progress --offline
        language: system
        types: [yaml]
        files: ^\.github/workflows/

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all
        language: system
        types: [rust]
        pass_filenames: false

      # --all-targets so test-target lints get an autofix offered here at
      # the commit stage rather than first appearing at the push-only gate.
      - id: clippy-fix
        name: clippy auto-fix
        entry: tests/host/heavy-run --need 4 --label "clippy auto-fix" -- cargo clippy --fix --allow-dirty --allow-staged --all-targets --all-features -- -W clippy::all
        language: system
        types: [rust]
        pass_filenames: false

      # Push-only: the commit stage already pays clippy-fix's compile, and
      # cargo-nextest-unit compiles the crate there, so what escapes to push
      # is lint-level findings only, never a compile error.
      - id: clippy-strict
        name: clippy gate
        entry: tests/host/heavy-run --need 4 --label "the clippy gate" -- cargo clippy --all-targets --all-features -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-push]

      - id: taplo-format
        name: taplo format
        entry: taplo format
        language: system
        types: [toml]

  # --- Tests (layered per the CLI testing pyramid) ---
  #
  # Uses cargo-nextest because it produces deterministic, token-efficient
  # output (suppresses stdout/stderr from passing tests by default) and
  # supports per-profile `default-filter` for clean test-kind layering.
  #
  # Test classification (CLI testing pyramid):
  #   - Unit:        `src/` inline `#[cfg(test)] mod tests`. One function
  #                  or module in isolation. kind(lib) for library crates;
  #                  kind(bin) when unit tests live inside a [[bin]] target
  #                  (binary-only crates with no [lib]).
  #   - Integration: `tests/*.rs`  (kind=test). Tests the *seam* between
  #                  components. The defining property is "tests the
  #                  interaction between things," NOT "touches real
  #                  things." A wrapper CLI exercising its argv contract
  #                  against a recording stub / faked child is integration.
  #   - E2E:         The whole product against real external systems
  #                  (real subprocess, real network, real container). E2E
  #                  belongs in CI ONLY — never pre-commit or pre-push:
  #                  too slow, too dependent on host state, too flaky to
  #                  gate local commits. Do NOT add an E2E hook here.
  #                  Deliberate exception: the user-workflow acceptance
  #                  binary remains in the pre-push kind(test) lane because
  #                  its runtime viv/Nix/KVM gates make it inert on hosts
  #                  without a usable microVM backend.
  #   - Doc tests:   `///` doctests in library items. NOT runnable by
  #                  nextest — covered by the separate `cargo test --doc`
  #                  hook below.
  #
  # Tier-to-hook mapping (lane taxonomy: docs/reference/testing-lanes.md):
  #   - pre-commit: unit only            (sub-second budget)
  #   - pre-push:   unit + integration   (minutes; .config/nextest.toml owns
  #                                       the measurement and the argument
  #                                       for the boot width)
  #   - CI:         everything + E2E     (live in .github/workflows)
  #
  # The unit hook is therefore wired to BOTH `pre-commit` and `pre-push`
  # stages: it's nearly free and guards against committed-but-not-tested
  # changes (rebases, amends) reaching the remote.
  #
  # Requires:
  #   - `cargo nextest` on PATH (cargo install --locked cargo-nextest)
  #   - the sibling `.config/nextest.toml` at the repo root, defining the
  #     `pre-commit` and `pre-push` profiles.
  - repo: local
    hooks:
      - id: cargo-nextest-unit
        name: cargo nextest (unit tests)
        entry: tests/host/heavy-run --need 4 --label "cargo nextest (unit tests)" -- cargo nextest run --profile pre-commit --all-features
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-commit, pre-push]

      - id: cargo-nextest-integration
        name: cargo nextest (integration tests)
        entry: tests/host/heavy-run --need 12 --label "cargo nextest (integration tests)" -- cargo nextest run --profile pre-push --all-features
        language: system
        types_or: [rust, toml]
        pass_filenames: false
        stages: [pre-push]

      - id: cargo-doc-tests
        name: cargo test --doc (doctests)
        entry: tests/host/heavy-run --need 4 --label "cargo test --doc" -- cargo test --doc --all-features
        language: system
        types_or: [rust, toml]
        pass_filenames: false
        stages: [pre-push]

  # --- Spell check + commit-message linting (both from the devShell) ---
  # Both use `language: system` off the flake devShell, NOT the crate-ci repo
  # hooks. Those are `language: python` and their wheels ship PREBUILT,
  # dynamically-linked binaries whose interpreter is /lib64/ld-linux-x86-64.so.2.
  # A dctl agents container has no FHS, so exec'ing one fails with
  # `[Errno 2] No such file or directory` naming the binary that plainly exists.
  # A Nix build of the same tool actually runs. Same pattern as
  # nixfmt/statix/deadnix below; version parity is flake.nix's job, not a `rev:`.
  - repo: local
    hooks:
      - id: typos
        name: typos
        entry: typos
        args: [--write-changes, --force-exclude]
        language: system
        types: [text]
        # No pre-push: --write-changes makes this an autofixer, and a hook
        # that rewrites files never runs at push (see default_stages above).
        stages: [pre-commit, pre-merge-commit, manual]

      - id: committed
        name: committed
        entry: committed
        args: [--fixup, --wip, --commit-file]
        language: system
        stages: [commit-msg]

  # --- Secret scanning (pre-commit, fast) ---
  - repo: https://github.com/sirwart/ripsecrets
    rev: v0.1.11
    hooks:
      - id: ripsecrets

  # --- Heavy checks (pre-push only) ---
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        entry: gitleaks git --redact --verbose
        pass_filenames: false
        stages: [pre-push]

  # --- Unused dependency detection ---
  - repo: https://github.com/bnjbvr/cargo-machete
    rev: v0.9.2
    hooks:
      - id: cargo-machete
        stages: [pre-push]

  - repo: local
    hooks:
      # cargo-audit is deliberately absent: `cargo deny check advisories`
      # reads the same RustSec database and adds yanked-crate coverage, so
      # one policy file (deny.toml) owns advisory, ban, source-registry,
      # and license posture, and one command reports all four.
      - id: cargo-deny
        name: cargo deny
        entry: cargo deny check advisories bans sources licenses
        language: system
        pass_filenames: false
        stages: [pre-push]

  # --- Nix: format (auto-fix) + lint (gate) ---
  #
  # Every project carries a per-project flake devShell, so these run against its
  # Nix sources. Tools come from that devShell (nix develop / direnv) and run as
  # system hooks off PATH, like dprint/cargo-fmt. nixfmt (RFC 166, the
  # nixpkgs-standard formatter) rewrites in place; statix and deadnix are
  # report-only gates — fix by hand or allowlist. statix walks the tree itself,
  # so its scope/ignore lives in the sibling `./statix.toml`. `nix flake check`
  # evaluates the flake and is scoped to Nix changes, at the pre-push stage.
  - repo: local
    hooks:
      - id: nixfmt
        name: nixfmt (format)
        entry: nixfmt
        language: system
        types: [nix]
        stages: [pre-commit]
      - id: statix
        name: statix (nix anti-patterns)
        entry: statix check
        language: system
        types: [nix]
        pass_filenames: false
        stages: [pre-commit]
      - id: deadnix
        name: deadnix (dead code)
        entry: deadnix --fail
        language: system
        types: [nix]
        stages: [pre-commit]
      # Two flake-evaluation hooks, each triggered by exactly the files its
      # flake contains — a predecessor fired on every `.nix` file while
      # evaluating only the root flake, whose `checks` the boundary guard
      # keeps empty, so its trigger and its subject disagreed (the
      # assumption-shaped-check class the harness method note records).
      # Neither hook builds a guest: the product checks are guest builds,
      # and that lane is tests/host/first-microvm-check behind
      # disk-preflight — a separation the disk-preflight rule requires,
      # not an omission.
      - id: dev-flake-check
        name: root dev flake evaluates (devShells + formatter only)
        entry: tests/host/heavy-run --need 2 --label "the root dev flake check" -- nix flake check
        language: system
        files: '^(flake\.nix|flake\.lock)$'
        pass_filenames: false
        stages: [pre-commit]
      # ~14s warm (measured 2026-08-14): instantiates the three product
      # checks without realising them, proving the product flake evaluates
      # and its checks are constructible.
      - id: product-flake-check
        name: product flake evaluates (checks instantiate, no build)
        entry: tests/host/heavy-run --need 4 --label "the product flake check" -- nix flake check --no-build path:.?dir=nix
        language: system
        files: '^(nix/.*\.nix|nix/flake\.lock|tests/nix/.*\.nix)$'
        pass_filenames: false
        stages: [pre-push]

  # --- Markdown: canonical format (dprint) + style gate (markdownlint) ---
  #
  # Universal overlay: every project carries docs/READMEs, so its markdown is
  # formatted and linted everywhere — the same model as the shared Nix overlay.
  # dprint owns canonical formatting; `markdown.textWrap: "never"` (in the sibling
  # ./dprint.markdown.json) unwraps every soft-wrapped paragraph to one continuous
  # physical line for small diffs and predictable LLM tokens. Explicit hard breaks
  # (two trailing spaces / trailing `\`) are preserved, fenced code blocks are left
  # unreflowed, and tables stay intact. markdownlint-cli2 gates style beyond what
  # dprint enforces and autofixes the one thing dprint can't — ordered-list
  # renumbering (MD029); rules live in the sibling ./.markdownlint-cli2.jsonc.
  #
  # A dedicated ./dprint.markdown.json + `--config` keeps this invocation
  # independent of the type's own JSON dprint.json, and the `dprint-markdown` id
  # never collides with the type's `dprint` hook.
  #
  # `flake.nix` supplies dprint on PATH, the same model as the json/nix hooks.
  # pre-commit only —
  # git push may strip PATH and the format is already applied by commit time.

  # --- Flake boundary ---
  #
  # The repository root's flake is the DEVELOPMENT ENVIRONMENT: the Rust
  # toolchain, the runtimes these hooks resolve off PATH, the devShell direnv
  # activates. What vivarium *builds* lives in `nix/flake.nix` with its own lock.
  #
  # This guard exists because the boundary was crossed twice, and both times by a
  # single line that read as reasonable in isolation — a `microvm` input here, a
  # `packages.first-microvm` there. A file acquires responsibilities one plausible
  # addition at a time, and prose alone is enforced by whoever remembers it.
  #
  # It asserts on the flake's own EVALUATED attribute names rather than on the
  # source text, because an output introduced through a `//` merge or a helper is
  # invisible to a grep and is exactly the shape that got through before. Runs
  # whenever either flake or its lock changes; `pass_filenames: false` because
  # the subject is the repository's shape, not the file it was reached through.
  - repo: local
    hooks:
      - id: flake-boundary
        name: root flake is the dev environment only
        entry: scripts/check-flake-boundary
        language: system
        pass_filenames: false
        files: ^(flake\.nix|flake\.lock|nix/.*\.nix|nix/flake\.lock|tests/nix/.*\.nix)$
        stages: [pre-commit]
      - id: verification-boundary
        name: product imports verification only through its publication surface
        entry: scripts/check-verification-boundary
        language: system
        pass_filenames: false
        files: ^(nix/|tests/nix/)
        stages: [pre-commit]

  # --- Lean Markdown (emphasis check, then table pipes, then dprint) ---
  #
  # Emphasis is forbidden in shipped Markdown. The standard-library checker is
  # fence- and inline-code-aware and runs before any formatter can normalize the
  # syntax it inspects.
  - repo: local
    hooks:
      - id: markdown-no-emphasis
        name: markdown contains no bold or italics
        entry: scripts/check-markdown-emphasis
        language: system
        types: [markdown]
        # `slides/` is presentation, not shipped prose, and a slide carries a
        # beat with weight the way a paragraph carries it with a sentence. The
        # per-line `<!-- allow-emphasis: -->` escape cannot express this: the
        # checker rejects file-level scope by design and demands the comment
        # immediately precede each violating line. So the exemption is
        # directory-scoped and named in ADR-0104 rather than smeared across a
        # deck as hundreds of individually-justified escapes.
        exclude: ^slides/
        stages: [pre-commit]

  # --- Table pipe integrity (MUST run before dprint) ---
  #
  # An unescaped `|` inside a code span in a table row makes GFM split that row
  # into more cells than the header declares. dprint then re-pads the row down to
  # the header's column count and DISCARDS the overflow, leaving a syntactically
  # valid row with content silently deleted — which is how the `viv exec` Purpose
  # cell was lost from docs/reference/spec/01-command-surface.md.
  #
  # Nothing downstream can catch this. markdownlint's MD056 (table-column-count)
  # detects the over-wide row, but only while it is still over-wide — and dprint
  # has already normalized it away by then. Reordering markdownlint ahead of dprint
  # does not work either: `--config` sets only the global config and the directory
  # .markdownlint-cli2.jsonc still merges over it, so a table-only rule set cannot
  # be isolated. Hence a dedicated guard that runs first and checks exactly one
  # thing. Fix a violation by escaping the pipe as `\|`, never by reflowing.
  - repo: local
    hooks:
      - id: markdown-table-pipes
        name: table-row code spans must escape `|` as `\|`
        entry: scripts/check-table-pipes
        language: system
        types: [markdown]
        # This guard exists because dprint re-pads a table down to the header's
        # column count and discards the overflow. dprint does not run on
        # `slides/` (see the dprint-markdown hook below), so there is nothing
        # here for the guard to protect against, and leaving it on would make
        # the deck answer for a formatter it never meets.
        exclude: ^slides/
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: dprint-markdown
        name: dprint fmt (markdown)
        entry: dprint fmt --config dprint.markdown.json
        language: system
        files: '\.(md|markdown)$'
        # The one exclusion in this file that is load-bearing rather than
        # tidy. A Slidev deck separates slides with `---` and opens each one
        # with its own YAML front matter; `textWrap: "never"` unwraps the line
        # above such a `---` onto it, and CommonMark then reads the pair as a
        # setext H2. The deck does not fail to build — it builds wrong, with
        # slides silently fused and their layout keys turned into prose. There
        # is no formatter-visible signal afterwards, which is why the deck is
        # kept out rather than taught to survive the pass. ADR-0104.
        exclude: '^slides/.*\.(md|markdown)$'
        pass_filenames: true
        stages: [pre-commit]

  # --- Explicit relative links (ambiguity guard; pre-commit, local) ---
  #
  # A bare-filename relative link like [x](runbook.md) is ambiguous: the same
  # basename can exist in many directories, so neither humans nor tools can tell
  # which file is meant, and the link silently rots when a file moves. Require an
  # explicit prefix: ./name, ../dir/name, or a multi-segment path dir/name.
  # Fragment-only (#...), root-absolute (/...), and URL links pass. pygrep is
  # built into pre-commit — no external dependency, no companion file.
  - repo: local
    hooks:
      - id: no-bare-relative-links
        name: inline markdown links must be explicit (./, ../, or a path)
        language: pygrep
        types: [markdown]
        entry: '\]\((?!https?://|ftp://|mailto:|tel:|/|#|\.\.?/)[^)/\s:]+\.[A-Za-z0-9]+(?:#[^)]*)?\)'
      - id: no-bare-relative-link-defs
        name: markdown link definitions must be explicit (./, ../, or a path)
        language: pygrep
        types: [markdown]
        entry: '^\s*\[[^\]]+\]:\s+(?!https?://|ftp://|mailto:|tel:|/|#|\.\.?/|<)[^\s/:#]+\.[A-Za-z0-9]+'

  # --- Markdown lint (style gate + ordered-list renumber autofix) ---
  #
  # Final order is emphasis check, table-pipe check, dprint, explicit relative-
  # link form checks, heading-shape wiring, then markdownlint. The generic
  # markdownlint hook keeps repository-wide style, relative-link integrity, and
  # ordered-list repair; three filtered hooks add the fixed document shapes from
  # `.markdownlint/`. markdownlint-cli2 runs AFTER dprint.
  # dprint owns all formatting; markdownlint flags issues dprint can't normalize.
  # Uses the node variant.
  # nodeenv cannot provision a usable Node here, so language_version: system
  # selects the flake's nodejs runtime — the same Nix-owns-the-runtime pattern
  # used by the typos/committed/dprint system hooks above.
  - repo: local
    hooks:
      - id: markdown-heading-shapes
        name: markdown heading shapes are owned and wired one-to-one
        entry: scripts/check-markdown-heading-shapes
        language: system
        pass_filenames: false
        files: '^(\.markdownlint/|\.markdownlint-cli2\.jsonc$|\.pre-commit-config\.yaml$|scripts/check-markdown-heading-shapes$|.*\.(md|markdown)$)'
        stages: [pre-commit]

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      - id: markdownlint-cli2
        # `default: true` gives this hook MD025 (one top-level H1 per document)
        # and the relative-links rule, and a deck breaks both by construction:
        # every slide opens with an H1, and Slidev's `@/` and `<<<` references
        # are resolved by Vite, not by the filesystem walk the rule performs.
        # The same exclusion is repeated in .markdownlint-cli2.jsonc's
        # `ignores` so a direct invocation agrees with this hook.
        exclude: ^slides/
        language_version: system
        additional_dependencies: ['markdownlint-rule-relative-links']
      - id: markdownlint-cli2
        alias: md-slice-readme
        name: markdownlint slice entry heading shape
        files: '^docs/plan/slices/[^/]+/README\.md$'
        args: ['--config', '.markdownlint/slice-readme.markdownlint-cli2.jsonc']
        language_version: system
        additional_dependencies: ['markdownlint-rule-relative-links']
      - id: markdownlint-cli2
        alias: md-milestones
        name: markdownlint milestone heading shape
        files: '^docs/plan/milestones\.md$'
        args: ['--config', '.markdownlint/milestones.markdownlint-cli2.jsonc']
        language_version: system
        additional_dependencies: ['markdownlint-rule-relative-links']
      - id: markdownlint-cli2
        alias: md-adr
        name: markdownlint decision heading shape
        files: '^docs/decisions/(ADR-.*|template)\.md$'
        args: ['--config', '.markdownlint/adr.markdownlint-cli2.jsonc']
        language_version: system
        additional_dependencies: ['markdownlint-rule-relative-links']

  # --- The round's own leftovers (report, never a gate) ---------------------
  #
  # Last at the push stage, because by then everything that writes has written:
  # the compile cache, the fixture roots, the guest closures, the volumes a boot
  # trial made, and whatever a hand-run lane left earlier in the session. The
  # report names each pile, its size, and the command that would clear it, and
  # leaves the deciding to whoever is reading — removing a sandbox volume is not
  # a call a hook may make on someone's behalf.
  #
  # It also answers the question the gate above raises: anything listed under
  # `host` is something a gated run puts on the drive, so a size there is
  # evidence that something ran outside the gate while the round is still fresh.
  #
  # `always_run` because it reports on the machine rather than on the diff, and
  # `verbose` because pre-commit prints a passing hook's output only when asked
  # — and this one always passes. A push is never blocked by what is on a disk.
  - repo: local
    hooks:
      - id: leftovers
        name: leftover sweep (report only)
        entry: tests/host/leftovers
        language: system
        always_run: true
        pass_filenames: false
        verbose: true
        stages: [pre-push]

  # --- Slides (Slidev deck) -------------------------------------------------
  #
  # Every Markdown gate above is excluded from `slides/`, so the deck's only
  # local check is whether it still builds. That is the check that matters: a
  # deck breaks at the Slidev layer — an unknown layout, a missing icon set, a
  # component that no longer resolves — and none of those are visible to a
  # linter reading the file as prose.
  #
  # Push-only, and scoped by `files:` so a push touching nothing under
  # `slides/` never pays for it. Same Nix-owns-the-runtime model as the cargo
  # and nix hooks at this stage: node comes from the devShell, Slidev comes
  # from `slides/node_modules`. The guard names the missing install rather
  # than letting npm report it as a missing script.
  - repo: local
    hooks:
      - id: slidev-build
        name: slidev build (deck still compiles)
        # Gated like its neighbours at this stage, and the honest note is that
        # what moves for it is `TMPDIR` alone: a deck's dependencies and its
        # built output are in-tree by construction, so `node_modules` and
        # `dist` stay where npm puts them no matter what this binds.
        entry: tests/host/heavy-run --need 2 --label "the slidev build" -- bash -c 'cd slides && { [ -d node_modules ] || { echo "slides/node_modules is missing; run \`just slides-install\`" >&2; exit 1; }; } && npm run build'
        language: system
        files: ^slides/
        pass_filenames: false
        stages: [pre-push]
