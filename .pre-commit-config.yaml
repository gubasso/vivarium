# Nix owns runtimes; prek, which the host supplies, owns hooks. The oldest
# prek that reads this file; `repo: builtin` needs prek.
minimum_prek_version: "0.5.7"
# project: no pre-merge-commit, here or in default_stages. The common set
# installs it for the integration gate of `rk integrate`, and this project
# integrates through forge requests instead.
default_install_hook_types: [pre-commit, commit-msg, pre-push]
# The node hook runs on the devShell nodejs. Without this line an empty
# hook cache can pick `default`, and nodeenv then fails on a prerelease
# entry of the node index: "invalid literal for int() with base 10: '0-alpha'"
# (2026-11-10).
default_language_version:
  node: system

# One stage per claim (ADR-0101). Without this line an unstaged hook runs at
# every installed stage, so the whole commit-stage set silently re-ran on
# push. The commit stage owns per-file and autofixing checks; the push stage
# owns whole-history and whole-tree policy, and a hook that rewrites files
# never appears there — a fix applied during `git push` cannot enter the push
# it just failed. A hook belongs at push only via an explicit `stages:` key.
default_stages: [pre-commit]

# Where the bytes go (ADR-0106). Every hook below that compiles, evaluates a
# flake, or boots a guest is invoked through `tests/host/heavy-run`, which
# resolves `VIVARIUM_HEAVY_DRIVE` and binds it into the hook's environment
# before the command starts. Without that, `git push` runs a suite that boots
# microVMs and realises guest closures straight onto the boot disk, and the
# first report is a filesystem at 100% partway through — which is how this
# repository learned it.
#
# The refusal is deterministic here because it has to be: prek runs every
# hook with standard input on `/dev/null`, so a gate at this stage cannot ask.
# No drive means exit `69` and nothing ran, with the escape named. To run on the
# host disk anyway, `VIVARIUM_HEAVY_ON_HOST=1 git push` — a variable rather than
# a flag because git passes no arguments to its hooks.
#
# The hooks that are NOT wrapped are the formatters, the markdown gates, the
# secret scans, `taplo`, `machete` and `deny`. They write kilobytes, and a
# whitespace commit should not need an external drive plugged in.

# A generated file follows its generator. The files a tool writes keep that
# tool's own form: release-plz's `CHANGELOG.md`, the lock files of cargo, nix
# and npm, release-kit's `.release-kit/manifest.json` and
# `.release-kit/config.toml`, and the two workflows
# release-kit renders, `pr-title.yml` and `release-plz.yml`, and cargo-dist's
# `release.yml`. No hook below
# rewrites one of them or judges its prose, and no generator is configured to
# please a hook, so a generator upgrade brings its new output with nothing here
# to patch. A hook that only reads such a file keeps it: the syntax parsers,
# the secret scans, actionlint (an accepted finding goes in
# `.github/actionlint.yaml`, never in the file), `rk-status-check`, and the
# lanes.
# Each exclusion sits in the tool's own configuration where the tool has one,
# so a direct run agrees with the hook: `dprint.json`, `dprint.markdown.json`,
# `.markdownlint-cli2.jsonc`, `_typos.toml`, `.editorconfig-checker.json`,
# `.taplo.toml`. A
# hook with no configuration of its own carries it in its `exclude:`. Never in
# the top-level `exclude:`, which would also hide the file from the secret,
# large-file and merge-conflict reads.
repos:
# BEGIN release-kit
# The release convention's hooks. Install every stage they run at with
# the hook manager this project uses, for example:
# prek install --hook-type pre-commit --hook-type commit-msg --hook-type pre-push --hook-type pre-merge-commit
# A hook that CI cannot run carries groups: [local-only], with its reason
# above it, and a hook that only CI runs carries stages: [manual] and
# groups: [ci-only]. Mark each hook of this project the same way. CI runs
# each stage with its group filter, through the project's environment, and
# no committed file sets SKIP. A group filter with no --stage also runs the
# manual hooks, so each step names its stage:
#   prek run --all-files --stage pre-commit --no-group local-only
#   prek run --all-files --stage pre-push --no-group local-only
#   prek run --all-files --stage manual --group ci-only
# prek refuses a --group that matches no hook, so leave the third step out
# where no hook carries ci-only.
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.5.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [--strict, --force-scope]
  - repo: local
    hooks:
      - id: rk-message
        name: rk message content
        stages: [commit-msg]
        language: system
        entry: rk message --check
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # local-only: a CI job on a trunk push checks out the trunk, which
      # this guard refuses.
      - id: no-commit-to-branch
        groups: [local-only]
        args: [--branch, master]
  - repo: local
    hooks:
      - id: rk-branch-name
        name: rk branch name
        language: system
        always_run: true
        pass_filenames: false
        entry: sh -c 'branch=$(git symbolic-ref --quiet --short HEAD) || exit 0; [ "$branch" = master ] && exit 0; printf %s "$branch" | grep -Eq "^((build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)/[A-Za-z0-9._/-]+|([0-9]+|[A-Z][A-Z0-9]+-[0-9]+)-[A-Za-z0-9._-]+|release[-/].+|rk-release/.+)$" && exit 0; echo "branch $branch is neither <type>/<slug> nor <issue-id>-<slug>; gh issue develop <issue> --checkout or its glab counterpart mints the linked form" >&2; exit 1'
      # local-only: a CI job checks out the main worktree, which this guard
      # refuses when the checkout is detached.
      - id: rk-worktree-location
        name: rk worktree location
        groups: [local-only]
        language: system
        always_run: true
        pass_filenames: false
        entry: sh -c '[ "$(git rev-parse --git-dir)" = "$(git rev-parse --git-common-dir)" ] || exit 0; branch=$(git symbolic-ref --quiet --short HEAD) || { echo "this project works in worktrees — the main checkout takes no commit, detached included; rk worktree add <branch> seats work in its own worktree" >&2; exit 1; }; [ "$branch" = master ] && exit 0; echo "this project works in worktrees — the main checkout holds the trunk and takes no branch commit; rk worktree add $branch gives this branch its own worktree" >&2; exit 1'
      - id: rk-no-push-to-trunk
        name: rk no push to trunk
        stages: [pre-push]
        language: system
        always_run: true
        pass_filenames: false
        entry: sh -c '[ "$PRE_COMMIT_REMOTE_BRANCH" != refs/heads/master ] || { echo "the trunk takes no direct push; it is written through merged requests alone" >&2; exit 1; }'
      - id: rk-no-hand-authored-tag
        name: rk no hand-authored tag
        stages: [pre-push]
        language: system
        always_run: true
        pass_filenames: false
        entry: sh -c 'case "$PRE_COMMIT_REMOTE_BRANCH" in refs/tags/v*) echo "never author a tag; the release automation mints every v* tag" >&2; exit 1;; esac'
      - id: rk-status-check
        name: rk status check
        language: system
        pass_filenames: false
        entry: rk status --check --target .
        files: '^(\.github/workflows/|\.gitlab-ci\.yml$|\.gitlab/ci/|AGENTS\.md$|\.release-kit/|\.pre-commit-config\.yaml$|release-plz\.toml$|dist-workspace\.toml$|cliff\.toml$|VERSION$)'
# END release-kit
  # --- prek built-in hooks (common set) ---
  #
  # prek runs these in its own binary: no clone, no environment, and no `rev`.
  # They take the place of the hooks of pre-commit/pre-commit-hooks and of
  # maresb/check-json5, and each argument restores the upstream behavior where
  # the built-in judges less by default
  # (https://prek.j178.dev/0.5.7/reference/built-in-hooks/).
  #
  # project: no hook here names the `pre-merge-commit` stage of the set. This
  # project integrates through forge requests, so it installs no
  # pre-merge-commit gate, as the common set says of a project without
  # `rk integrate`.
  #
  # project: the fixers carry the generated files of this repository, which
  # the set's pattern does not hold: release-kit's `.release-kit/config.toml`
  # and the three workflows that release-kit and cargo-dist render (see the
  # note above `repos:`). The pattern holds only files the project has, so
  # check-useless-excludes accepts it.
  - repo: builtin
    hooks:
      # The upstream manifest declares pre-push too, and the built-in copies it.
      # A fixer never runs at push. The argument keeps a Markdown hard break.
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        stages: [pre-commit]
        exclude: &generated '^(CHANGELOG\.md|Cargo\.lock|flake\.lock|nix/flake\.lock|slides/package-lock\.json|\.release-kit/(manifest\.json|config\.toml)|\.github/workflows/(pr-title|release-plz|release)\.yml)$|^\.(claude|agents)/skills/(rk-setup|rk-release)/'
      - id: end-of-file-fixer
        stages: [pre-commit]
        exclude: *generated
      # The default `auto` keeps the most frequent ending of a file, so a file
      # that holds only CRLF passes. `--fix=lf` holds every file to LF.
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: *generated
      # 2 MiB, the most common limit of the owned projects. A project that
      # tracks larger fixtures or documents raises it, or adds a second entry
      # with its own `files:` for that folder.
      - id: check-added-large-files
        args: [--maxkb=2048]
        stages: [pre-commit]
      - id: check-case-conflict
      # Without the argument the hook passes outside a merge or a rebase, so a
      # marker that a resolved conflict left behind lands unseen.
      - id: check-merge-conflict
        args: [--assume-in-merge]
      - id: check-symlinks
      - id: destroyed-symlinks
        stages: [pre-commit]
      - id: check-executables-have-shebangs
        stages: [pre-commit]
      - id: check-shebang-scripts-are-executable
        stages: [pre-commit]
      # prek accepts an unknown tag unless it gets --disallow-unknown-tags. The
      # upstream hook refuses one while it loads the file.
      - id: check-yaml
        args: [--disallow-unknown-tags]
      - id: check-toml
      - id: check-xml
      # check-json5 parses JSON with comments and trailing commas, so it does
      # not refuse a commented .json configuration such as dprint.json or a
      # .jsonc file. `types` resets the filter to every file, and `types_or`
      # restores json and json5 and adds jsonc. It is the syntax gate only:
      # dprint owns the layout.
      - id: check-json5
        types: [file]
        types_or: [json, json5, jsonc]
      # detect-private-key is deliberately absent: its PEM-marker rule is a
      # subset of ripsecrets (commit stage) and gitleaks (push stage, full
      # history), verified 2026-08-14 by planting a throwaway key and
      # confirming both flag it.

  # forbid-submodules has no built-in: prek's forbid-new-submodules ignores a
  # submodule that already exists. It stays the upstream hook, at the `rev` of
  # the release-kit block. no-commit-to-branch is absent here: the release-kit
  # block carries it, and one job takes one hook.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: forbid-submodules

  # --- JSON / JSONC formatter: dprint (comment-safe autofix) ---
  #
  # dprint's json plugin formats JSON and JSONC (comments + trailing commas),
  # which the stdlib-based pretty-format-json cannot. check-json5 above stays the
  # syntax gate; dprint owns formatting. Config in the sibling `./dprint.json`
  # (plugin version pinned there). `flake.nix` supplies dprint on PATH.
  # pre-commit only — git push
  # may strip PATH, and formatting is already applied by commit time.
  - repo: local
    hooks:
      # owner: devshell (no-hook-language) upstream dprint publishes no pre-commit hook.
      - id: dprint
        name: dprint fmt (json/jsonc)
        # --allow-no-files because prek splits the matched paths into
        # batches and dprint.json excludes some of them (`**/*-lock.json`). A
        # batch that happens to hold only excluded paths makes `dprint fmt`
        # exit 14, so without this flag the hook passes or fails on how many
        # JSON files the repository has. The `files:` pattern below and
        # dprint's own `excludes` still decide what is formatted.
        entry: dprint fmt --allow-no-files
        language: system
        files: '\.(json|jsonc|json5)$'
        pass_filenames: true
        stages: [pre-commit]

  # --- EditorConfig ---
  #
  # The upstream `language: golang` hook, which prek builds at the pinned rev.
  # It checks what no formatter owns: the charset, the line endings, the
  # trailing whitespace, and the indent style.
  #   - -disable-insert-final-newline: end-of-file-fixer owns it.
  #   - -disable-indent-size: each formatter owns the indentation of its files
  #     (rustfmt, ruff, dprint, nixfmt, shfmt). The checker counts left padding
  #     without the syntax, so it refuses formatter output.
  # Markdown is excluded: the checker flags fenced code and the odd-width
  # continuation of an ordered list, and dprint owns Markdown. The generated
  # files (see the note above `repos:`) are excluded in
  # `.editorconfig-checker.json`, which a direct run reads too.
  - repo: https://github.com/editorconfig-checker/editorconfig-checker
    rev: v3.9.0
    hooks:
      - id: editorconfig-checker
        alias: ec
        args: [-disable-insert-final-newline, -disable-indent-size]
        exclude: '\.md$'

  # --- Table of contents ---
  #
  # md-toc rewrites the list between two `<!--TOC-->` markers, and leaves a
  # file without the markers alone.
  #   - -p writes in place.
  #   - -c does not judge the coherence of the heading levels.
  #   - --skip-lines 1 leaves the H1 title out of the list.
  - repo: https://github.com/frnmst/md-toc
    rev: 9.1.0
    hooks:
      - id: md-toc
        args: [-p, -c, --skip-lines, '1', github]

  # --- Shell and Python: lint + format ---
  #
  # shellcheck stays a devShell tool, because actionlint, a managed hook, runs
  # the shellcheck on PATH over the `run:` scripts of the workflows. shfmt and
  # ruff take their upstream hooks, which prek builds: scop/pre-commit-shfmt
  # ships a static binary, and ruff-pre-commit ships ruff. The host supplies the
  # standard ELF loader for any dynamically linked wheel (nix-ld on a NixOS
  # host). Each keeps the selectors and the arguments the local hooks had; the
  # shfmt and ruff manifests name more stages than the commit stage, so
  # `stages:` is explicit.
  - repo: local
    hooks:
      # owner: devshell (outside-caller) actionlint runs the shellcheck on PATH, so the hook runs the same one.
      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        language: system
        types: [shell]
        require_serial: true
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.13.1-1
    hooks:
      # project: --write -i 2 -ci -bn in place of the set's [--write] with the
      # layout in .editorconfig, because most shell programs here are
      # extensionless (`scripts/foo`, `tests/host/foo`), no EditorConfig section
      # can select them by name without also selecting the Python programs
      # beside them, and shfmt falls back to tabs for a file no section matches.
      - id: shfmt
        args: [--write, -i, '2', -ci, -bn]
        types: [shell]
        stages: [pre-commit]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff-check
        args: [--fix]
        types_or: [python, pyi]
        stages: [pre-commit]
      - id: ruff-format
        types_or: [python, pyi]
        stages: [pre-commit]

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  # zizmor is out while cargo-dist's generated `release.yml` fails it, and
  # comes back when the template is fixed: KI-0003 in
  # docs/reference/known-issues/ owns the case.

  - repo: local
    hooks:
      # A check, not a fix: a hook that rewrites a file leaves the staged copy
      # behind, so `cargo fmt --check` fails and the author formats.
      # owner: devshell (project-environment) cargo fmt is part of the Rust toolchain that the devshell pins.
      - id: cargo-fmt
        name: cargo fmt check
        entry: cargo fmt --check
        language: system
        files: '(\.rs|(^|/)Cargo\.(toml|lock)|^rust-toolchain\.toml)$'
        pass_filenames: false

      # project: clippy-fix and clippy-strict in place of the set's
      # cargo-clippy, which gates `-D warnings` at commit. One stage per claim
      # (ADR-0101): the commit stage offers the autofix, the push stage holds
      # the gate, and both compile through heavy-run (ADR-0106).
      # --all-targets so test-target lints get an autofix offered here at
      # the commit stage rather than first appearing at the push-only gate.
      # owner: devshell (project-environment) cargo clippy is part of the Rust toolchain and builds the crate.
      - id: clippy-fix
        name: clippy auto-fix
        entry: tests/host/heavy-run --need 4 --label "clippy auto-fix" -- cargo clippy --fix --allow-dirty --allow-staged --all-targets --all-features -- -W clippy::all
        language: system
        types: [rust]
        pass_filenames: false

      # Push-only: the commit stage already pays clippy-fix's compile, and
      # cargo-nextest-unit compiles the crate there, so what escapes to push
      # is lint-level findings only, never a compile error.
      # owner: devshell (project-environment) cargo clippy is part of the Rust toolchain and builds the crate.
      - id: clippy-strict
        name: clippy gate
        entry: tests/host/heavy-run --need 4 --label "the clippy gate" -- cargo clippy --all-targets --all-features -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-push, manual]

      # owner: devshell (no-hook-language) upstream taplo publishes no pre-commit hook.
      - id: taplo-format
        name: taplo format
        entry: taplo format
        language: system
        types: [toml]

  # --- The test lanes ---------------------------------------------------
  #
  # This file is the only place a lane's command is written. `just`, `git`, and
  # `.github/workflows/ci.yml` invoke a lane by hook id and never repeat its
  # command, so the three places cannot drift the way the justfile's "keep these
  # byte-identical" twins asked a reader to keep them from drifting.
  #
  # A lane is named for what it needs, because the need is what decides where it
  # can run. `.config/nextest.toml` carries one profile per lane and each selects
  # by binary name; `Cargo.toml` requires every integration binary to carry its
  # lane as a name prefix; `tests/support/preflight.rs` is where a binary asks its
  # host for what it declared. Nothing skips itself: a lane run where its need is
  # unmet fails with the reason. `docs/reference/testing-lanes.md` is the register.
  #
  #   unit   nothing                                          commit, push, CI
  #   local  the built `viv` and a filesystem                 push, CI
  #   eval   `nix` on PATH                                    push, CI
  #   net    the namespace tools and a creatable ns pair      push, CI
  #   boot   /dev/kvm, a systemd user manager, nix            push (product paths)
  #   doc    nothing (nextest cannot run doctests)            push, CI
  #
  # Every lane carries `manual`, which is what makes `prek run --hook-stage
  # manual <id> --all-files` the one way to run any lane anywhere — the form
  # `just test <lane>` wraps and the form CI's matrix calls.
  #
  # `--all-features` on every one of them. The guest agent is a binary of this
  # package behind the `guest` feature, so without it the agent's unit tests
  # never compile, and the lane passes with them unrun.
  #
  # project: these lanes stand in place of the set's single cargo-nextest
  # hook, because each lane needs a different host (ADR-0114) and runs in a
  # different place.
  - repo: local
    hooks:
      # owner: devshell (project-environment) cargo nextest runs a test lane of the crate.
      - id: test-unit
        name: test unit (needs nothing)
        entry: tests/host/heavy-run --need 4 --label "the unit lane" -- cargo nextest run --profile unit --all-features
        language: system
        types: [rust]
        pass_filenames: false
        # The one lane at the commit stage. It is nearly free, and running it
        # again at push is what catches a rebase or an amend that never met the
        # commit stage at all.
        stages: [pre-commit, pre-push, manual]

      # owner: devshell (project-environment) cargo nextest runs a test lane of the crate.
      - id: test-local
        name: test local (needs the built viv)
        entry: tests/host/heavy-run --need 6 --label "the local lane" -- cargo nextest run --profile local --all-features
        language: system
        types_or: [rust, toml]
        pass_filenames: false
        stages: [pre-push, manual]

      # owner: devshell (project-environment) cargo nextest runs a test lane of the crate.
      - id: test-eval
        name: test eval (needs nix)
        entry: tests/host/heavy-run --need 8 --label "the eval lane" -- cargo nextest run --profile eval --all-features
        language: system
        types_or: [rust, toml, nix]
        pass_filenames: false
        stages: [pre-push, manual]

      # owner: devshell (project-environment) cargo nextest runs a test lane of the crate.
      - id: test-net
        name: test net (needs unprivileged namespaces)
        entry: tests/host/heavy-run --need 4 --label "the net lane" -- cargo nextest run --profile net --all-features
        language: system
        types_or: [rust, toml]
        pass_filenames: false
        stages: [pre-push, manual]

      # owner: devshell (project-environment) cargo nextest runs a test lane of the crate.
      - id: test-boot
        name: test boot (needs a virtualization-capable host)
        entry: tests/host/heavy-run --need 12 --label "the boot lane" -- cargo nextest run --profile boot --all-features
        language: system
        pass_filenames: false
        # Scoped by path rather than by file type, and this is the one `files:`
        # in this block that is load-bearing. Twenty-six boots is roughly fifteen
        # minutes, which is a fair price for a change to the product and no price
        # a documentation push should pay. At the push stage prek matches
        # this against the pushed range; under `--all-files` it always runs.
        files: '^(src/|nix/|tests/(boot_|support/)|Cargo\.(toml|lock)$|rust-toolchain\.toml$)'
        stages: [pre-push, manual]

      # owner: devshell (project-environment) cargo test --doc runs the doctests of the crate.
      - id: test-doc
        name: test doc (doctests)
        # nextest cannot run doctests, so this is `cargo test --doc` and stays
        # outside the profile scheme. https://nexte.st/docs/running/
        entry: tests/host/heavy-run --need 4 --label "the doc lane" -- cargo test --doc --all-features
        language: system
        types_or: [rust, toml]
        pass_filenames: false
        stages: [pre-push, manual]

  # --- The host lanes (manual only) --------------------------------------
  #
  # The measurement and acceptance scripts under `tests/host/`. Each boots a real
  # guest, measures a real store, or both, and several take tens of minutes; one
  # deletes from the invoking user's own store. None of that belongs at a git
  # stage or on a runner, so they are declared here and reached by name —
  # `just lane <name>`, or `prek run --hook-stage manual lane-<name>`.
  #
  # Declaring them earns two things over leaving them as bare scripts. They appear
  # in `prek run --hook-stage manual --all-files` alongside every other lane,
  # so the register is one list rather than two; and `scripts/check-lane-register`
  # can hold this list against the filesystem, so a script added without a hook is
  # a failure rather than a lane nobody remembers.
  #
  # Each script calls `tests/host/disk-preflight` itself and names the space it
  # needs, so none is wrapped in `heavy-run` here.
  #
  # `docs/reference/microvm-verification-harness.md` says what each one proves.
  - repo: local
    hooks:
      # owner: devshell (no-hook-language) a script of this repository under tests/host, which runs on the host.
      - id: lane-base-image
        name: lane base-image (builds and boots the base image)
        entry: tests/host/base-image-check
        language: system
        always_run: true
        pass_filenames: false
        verbose: true
        stages: [manual]
      # owner: devshell (no-hook-language) a script of this repository under tests/host, which runs on the host.
      - id: lane-contract-skew
        name: lane contract-skew (the pre-boot refusal, twice)
        entry: tests/host/contract-skew-check
        language: system
        always_run: true
        pass_filenames: false
        verbose: true
        stages: [manual]
      # owner: devshell (no-hook-language) a script of this repository under tests/host, which runs on the host.
      - id: lane-exec-and-shell
        name: lane exec-and-shell (the two session verbs, twice)
        entry: tests/host/exec-and-shell-check
        language: system
        always_run: true
        pass_filenames: false
        verbose: true
        stages: [manual]
      # owner: devshell (no-hook-language) a script of this repository under tests/host, which runs on the host.
      - id: lane-generations
        name: lane generations (runs the whole-store viv gc)
        entry: tests/host/generations-check
        language: system
        always_run: true
        pass_filenames: false
        verbose: true
        stages: [manual]
      # owner: devshell (no-hook-language) a script of this repository under tests/host, which runs on the host.
      - id: lane-guest-agent
        name: lane guest-agent (the control plane, twice)
        entry: tests/host/guest-agent-check
        language: system
        always_run: true
        pass_filenames: false
        verbose: true
        stages: [manual]
      # owner: devshell (no-hook-language) a script of this repository under tests/host, which runs on the host.
      - id: lane-guest-system
        name: lane guest-system (an example manifest reaches a derivation)
        entry: tests/host/guest-system-check
        language: system
        always_run: true
        pass_filenames: false
        verbose: true
        stages: [manual]
      # owner: devshell (no-hook-language) a script of this repository under tests/host, which runs on the host.
      - id: lane-share-benchmark
        name: lane share-benchmark (the virtiofsd pool sweep)
        entry: tests/host/share-benchmark-check
        language: system
        always_run: true
        pass_filenames: false
        verbose: true
        stages: [manual]
      # owner: devshell (no-hook-language) a script of this repository under tests/host, which runs on the host.
      - id: lane-store-density
        name: lane store-density (bytes per inode; boots nothing)
        entry: tests/host/store-density-check
        language: system
        always_run: true
        pass_filenames: false
        verbose: true
        stages: [manual]
      # owner: devshell (no-hook-language) a script of this repository under tests/host, which runs on the host.
      - id: lane-store-gc-interlock
        name: lane store-gc-interlock (deletes from the host store)
        entry: tests/host/store-gc-interlock-check
        language: system
        always_run: true
        pass_filenames: false
        verbose: true
        stages: [manual]
      # owner: devshell (no-hook-language) a script of this repository under tests/host, which runs on the host.
      - id: lane-store-pressure
        name: lane store-pressure (a real space crossing; the longest lane)
        entry: tests/host/store-pressure-check
        language: system
        always_run: true
        pass_filenames: false
        verbose: true
        stages: [manual]
      # owner: devshell (no-hook-language) a script of this repository under tests/host, which runs on the host.
      - id: lane-update
        name: lane update (the user moves a pin and reads the guest)
        entry: tests/host/update-check
        language: system
        always_run: true
        pass_filenames: false
        verbose: true
        stages: [manual]

  # deadnix publishes a rust hook, which prek builds; its manifest
  # carries --fail and the nix file type.
  - repo: https://github.com/astro/deadnix
    rev: v1.3.2
    hooks:
      - id: deadnix
  - repo: local
    hooks:
      # A flake holds no language library: a package belongs to the manifest
      # of its stack, and the devShell keeps the toolchain.
      - id: no-language-library-in-flake
        name: a flake holds no language library
        language: pygrep
        entry: '^(?!\s*#).*(withPackages|python3[0-9]*Packages\.|pythonPackages\.|nodePackages\.|perlPackages\.)'
        files: '(^|/)flake\.nix$|(^|/)nix/.*\.nix$'

  # A flake reference to this working tree reads its git tree, `git+file:`, and
  # never a `path:` copy, which would also carry every untracked and ignored
  # file into the store. A legitimate `path:` (a store path, a relative input
  # inside a generated flake, a throwaway fixture) carries the marker
  # `nix-path-ok: <reason>` on that same line. Accepted ADR bodies never
  # change, so `docs/decisions/` is excluded rather than marked.
  - repo: https://github.com/gubasso/exobrain-tech
    rev: v1.0.0
    hooks:
      - id: no-path-flake-reference
        exclude: ^docs/decisions/

  # --- Spelling, report only ---
  #
  # The upstream `language: python` hook. Its wheel holds a prebuilt binary
  # that links the standard ELF loader, which the host supplies (nix-ld on a
  # NixOS host).
  #
  # The args replace the upstream [--write-changes, --force-exclude]. An
  # automatic fix once renamed a deliberate identifier and an error-kind
  # string of a machine-readable contract. Fix a real typo by hand, and
  # allowlist a false positive in _typos.toml. --force-exclude keeps the
  # excludes of _typos.toml for the files that prek passes. The manifest
  # declares pre-push too, so `stages:` is explicit.
  - repo: https://github.com/crate-ci/typos
    rev: v1.47.2
    hooks:
      - id: typos
        args: [--force-exclude]
        stages: [pre-commit]

  # --- Commit message ---
  #
  # The upstream `language: python` hook, with its own args
  # (--fixup --wip --commit-file). committed.toml holds the rules.
  - repo: https://github.com/crate-ci/committed
    rev: v1.1.11
    hooks:
      - id: committed
        stages: [commit-msg]

  # --- Secrets ---
  #
  # Two layers. ripsecrets, the upstream `language: rust` hook, scans what each
  # commit adds. gitleaks scans the whole history before a push: the upstream
  # entry scans the staged index, which is empty at a push, so this entry scans
  # the history and passes no file names.
  - repo: https://github.com/sirwart/ripsecrets
    rev: v0.1.11
    hooks:
      - id: ripsecrets
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      # project: `manual` too, because the CI matrix runs each push hook at
      # the manual stage.
      - id: gitleaks
        entry: gitleaks git --redact --verbose --no-banner
        pass_filenames: false
        stages: [pre-push, manual]

  # --- Link check, at push ---
  #
  # A network check, so it runs at push. lychee.toml holds every setting, and
  # git ignores the cache file .lycheecache. The default `lychee` id is a
  # `script` hook that downloads a release binary through cargo-binstall
  # during the run, and fails in an offline or sandboxed shell. The devshell
  # supplies lychee, and the rev pins only the hook definition. `prek update`
  # moves this rev to the pre-release tag `nightly`. Keep the latest release.
  - repo: https://github.com/lycheeverse/lychee
    rev: lychee-v0.24.2
    hooks:
      # project: `manual` too, because the CI matrix runs each push hook at
      # the manual stage.
      # owner: devshell (no-hook-language) upstream lychee offers only script, docker_image, and system ids.
      - id: lychee-system
        stages: [pre-push, manual]
        types: [markdown]
        args: [--no-progress]

  # --- Unused dependencies, at push ---
  #
  # The upstream `language: rust` hook, which prek builds with the cargo of the
  # devshell. Its manifest passes no file names and runs the scan of the whole
  # workspace only when a manifest or the lock file changes.
  - repo: https://github.com/bnjbvr/cargo-machete
    rev: v0.9.2
    hooks:
      # project: `manual` too, because the CI matrix runs each push hook at
      # the manual stage.
      - id: cargo-machete
        stages: [pre-push, manual]

  - repo: local
    hooks:
      # cargo deny reads the RustSec database that cargo audit reads, and adds
      # the yanked crates, the bans, the sources, and the licenses, so one
      # policy file, deny.toml, owns all four, and cargo audit stays out.
      # project: `manual` too, because the CI matrix runs each push hook at
      # the manual stage.
      # owner: devshell (project-environment) cargo deny is a cargo subcommand that reads the lock file of the workspace.
      - id: cargo-deny
        name: cargo deny
        entry: cargo deny check
        language: system
        files: '((^|/)Cargo\.(toml|lock)|^deny\.toml)$'
        pass_filenames: false
        stages: [pre-push, manual]

  # --- Nix: format (auto-fix) + lint (gate) ---
  #
  # Every project carries a per-project flake devShell, so these run against its
  # Nix sources. nixfmt and statix come from that devShell (nix develop /
  # direnv) and run as system hooks off PATH, like dprint/cargo-fmt; nixfmt is
  # also the flake's formatter for `nix fmt`. deadnix runs as its upstream rust
  # hook below. nixfmt (RFC 166, the nixpkgs-standard formatter) rewrites in
  # place; statix and deadnix are
  # report-only gates — fix by hand or allowlist. statix walks the tree itself,
  # so its scope/ignore lives in the sibling `./statix.toml`. `nix flake check`
  # evaluates the flake and is scoped to Nix changes, at the pre-push stage.
  - repo: local
    hooks:
      # owner: devshell (outside-caller) nix fmt and the base-image lane run the flake's pkgs.nixfmt, so the hook runs the same one.
      - id: nixfmt
        name: nixfmt (format)
        entry: nixfmt
        language: system
        types: [nix]
      # owner: devshell (no-hook-language) statix has no hook in a language that prek builds.
      - id: statix
        name: statix (nix anti-patterns)
        entry: statix check
        language: system
        types: [nix]
        pass_filenames: false
      # Two flake-evaluation hooks, each triggered by exactly the files its
      # flake contains — a predecessor fired on every `.nix` file while
      # evaluating only the root flake, whose `checks` the boundary guard
      # keeps empty, so its trigger and its subject disagreed (the
      # assumption-shaped-check class the harness method note records).
      # Neither hook builds a guest: the product checks are guest builds,
      # and that lane is tests/host/base-image-check behind
      # disk-preflight — a separation the disk-preflight rule requires,
      # not an omission.
      # owner: host (no-hook-language) nix comes from the host; tests/host/heavy-run is a script of this repository.
      - id: dev-flake-check
        name: root dev flake evaluates (devShells + formatter only)
        entry: tests/host/heavy-run --need 2 --label "the root dev flake check" -- nix flake check
        language: system
        files: '^(flake\.nix|flake\.lock)$'
        pass_filenames: false
        stages: [pre-commit, manual]
      # ~14s warm (measured 2026-08-14): instantiates the three product
      # checks without realising them, proving the product flake evaluates
      # and its checks are constructible.
      # owner: host (no-hook-language) nix comes from the host; tests/host/heavy-run is a script of this repository.
      - id: product-flake-check
        name: product flake evaluates (checks instantiate, no build)
        entry: tests/host/heavy-run --need 4 --label "the product flake check" -- nix flake check --no-build git+file:.?dir=nix
        language: system
        files: '^(nix/.*\.nix|nix/flake\.lock|tests/nix/.*\.nix)$'
        pass_filenames: false
        stages: [pre-push, manual]

  # --- Markdown: canonical format (dprint) + style gate (markdownlint) ---
  #
  # Universal overlay: every project carries docs/READMEs, so its markdown is
  # formatted and linted everywhere — the same model as the shared Nix overlay.
  # dprint owns canonical formatting; `markdown.textWrap: "never"` (in the sibling
  # ./dprint.markdown.json) unwraps every soft-wrapped paragraph to one continuous
  # physical line for small diffs and predictable LLM tokens. Explicit hard breaks
  # (two trailing spaces / trailing `\`) are preserved, fenced code blocks are left
  # unreflowed, and tables stay intact. markdownlint-cli2 gates style beyond what
  # dprint enforces and autofixes the one thing dprint can't — ordered-list
  # renumbering (MD029); rules live in the sibling ./.markdownlint-cli2.jsonc.
  #
  # A dedicated ./dprint.markdown.json + `--config` keeps this invocation
  # independent of the type's own JSON dprint.json, and the `dprint-markdown` id
  # never collides with the type's `dprint` hook.
  #
  # `flake.nix` supplies dprint on PATH, the same model as the json/nix hooks.
  # pre-commit only —
  # git push may strip PATH and the format is already applied by commit time.

  # --- Flake boundary ---
  #
  # The repository root's flake is the DEVELOPMENT ENVIRONMENT: the Rust
  # toolchain, the runtimes these hooks resolve off PATH, the devShell direnv
  # activates. What vivarium *builds* lives in `nix/flake.nix` with its own lock.
  #
  # This guard exists because the boundary was crossed twice, and both times by a
  # single line that read as reasonable in isolation — a `microvm` input here, a
  # `packages.base-image` there. A file acquires responsibilities one plausible
  # addition at a time, and prose alone is enforced by whoever remembers it.
  #
  # It asserts on the flake's own EVALUATED attribute names rather than on the
  # source text, because an output introduced through a `//` merge or a helper is
  # invisible to a grep and is exactly the shape that got through before. Runs
  # whenever either flake or its lock changes; `pass_filenames: false` because
  # the subject is the repository's shape, not the file it was reached through.
  - repo: local
    hooks:
      # owner: host (no-hook-language) a script of this repository that calls bash and nix.
      - id: flake-boundary
        name: root flake is the dev environment only
        entry: scripts/check-flake-boundary
        language: system
        pass_filenames: false
        files: ^(flake\.nix|flake\.lock|nix/.*\.nix|nix/flake\.lock|tests/nix/.*\.nix)$
        stages: [pre-commit]
      # The lanes are a claim spread across four files, and a change to one and
      # not the others leaves a lane declared and never executed — which reads
      # from the outside exactly like a lane that passes. Same guard as the two
      # above, applied to the test register rather than to the flakes. The
      # script's docstring carries the six rules.
      # owner: devshell (no-hook-language) a script of this repository, run by the devShell python3.
      - id: check-lane-register
        name: the lane register agrees with itself
        entry: scripts/check-lane-register
        language: system
        pass_filenames: false
        files: ^(\.pre-commit-config\.yaml|\.config/nextest\.toml|Cargo\.toml|\.github/workflows/ci\.yml|scripts/check-lane-register|tests/(host/[^/]+|[^/]+\.rs))$
        stages: [pre-commit]

      # owner: host (no-hook-language) a script of this repository that calls bash and grep.
      - id: verification-boundary
        name: product imports verification only through its publication surface
        entry: scripts/check-verification-boundary
        language: system
        pass_filenames: false
        files: ^(nix/|tests/nix/)
        stages: [pre-commit]

  # --- Lean Markdown (emphasis check, then table pipes, then dprint) ---
  #
  # Emphasis is forbidden in shipped Markdown. The standard-library checker is
  # fence- and inline-code-aware and runs before any formatter can normalize the
  # syntax it inspects.
  - repo: local
    hooks:
      # owner: devshell (no-hook-language) a script of this repository, run by the devShell python3.
      - id: markdown-no-emphasis
        name: markdown contains no bold or italics
        entry: scripts/check-markdown-emphasis
        language: system
        types: [markdown]
        # `slides/` is presentation, not shipped prose, and a slide carries a
        # beat with weight the way a paragraph carries it with a sentence. The
        # per-line `<!-- allow-emphasis: -->` escape cannot express this: the
        # checker rejects file-level scope by design and demands the comment
        # immediately precede each violating line. So the exemption is
        # directory-scoped and named in ADR-0104 rather than smeared across a
        # deck as hundreds of individually-justified escapes. `CHANGELOG.md`
        # is release-plz's, and its native form sets each commit scope in
        # italics and each breaking change in bold.
        exclude: ^(slides/|CHANGELOG\.md$)
        stages: [pre-commit]

  # --- Table pipe integrity (MUST run before dprint) ---
  #
  # An unescaped `|` inside a code span in a table row makes GFM split that row
  # into more cells than the header declares. dprint then re-pads the row down to
  # the header's column count and DISCARDS the overflow, leaving a syntactically
  # valid row with content silently deleted — which is how the `viv exec` Purpose
  # cell was lost from docs/reference/spec/01-command-surface.md.
  #
  # Nothing downstream can catch this. markdownlint's MD056 (table-column-count)
  # detects the over-wide row, but only while it is still over-wide — and dprint
  # has already normalized it away by then. Reordering markdownlint ahead of dprint
  # does not work either: `--config` sets only the global config and the directory
  # .markdownlint-cli2.jsonc still merges over it, so a table-only rule set cannot
  # be isolated. Hence a dedicated guard that runs first and checks exactly one
  # thing. Fix a violation by escaping the pipe as `\|`, never by reflowing.
  - repo: local
    hooks:
      # owner: devshell (no-hook-language) a script of this repository, run by the devShell python3.
      - id: markdown-table-pipes
        name: table-row code spans must escape `|` as `\|`
        entry: scripts/check-table-pipes
        language: system
        types: [markdown]
        # This guard exists because dprint re-pads a table down to the header's
        # column count and discards the overflow. dprint does not run on
        # `slides/` (see the dprint-markdown hook below), so there is nothing
        # here for the guard to protect against, and leaving it on would make
        # the deck answer for a formatter it never meets. The same holds for
        # release-plz's `CHANGELOG.md`, which `dprint.markdown.json` excludes.
        exclude: ^(slides/|CHANGELOG\.md$)
        stages: [pre-commit]

  - repo: local
    hooks:
      # owner: devshell (no-hook-language) upstream dprint publishes no pre-commit hook.
      - id: dprint-markdown
        name: dprint fmt (markdown)
        # --allow-no-files for the reason the json hook above gives:
        # `dprint.markdown.json` excludes release-plz's `CHANGELOG.md`, and a
        # batch that holds only that file must not fail with exit 14.
        entry: dprint fmt --allow-no-files --config dprint.markdown.json
        language: system
        files: '\.(md|markdown)$'
        # The one exclusion in this file that is load-bearing rather than
        # tidy. A Slidev deck separates slides with `---` and opens each one
        # with its own YAML front matter; `textWrap: "never"` unwraps the line
        # above such a `---` onto it, and CommonMark then reads the pair as a
        # setext H2. The deck does not fail to build — it builds wrong, with
        # slides silently fused and their layout keys turned into prose. There
        # is no formatter-visible signal afterwards, which is why the deck is
        # kept out rather than taught to survive the pass. ADR-0104.
        exclude: '^slides/.*\.(md|markdown)$'
        pass_filenames: true
        stages: [pre-commit]

  # --- Explicit relative links (ambiguity guard; pre-commit, local) ---
  #
  # A bare-filename relative link like [x](runbook.md) is ambiguous: the same
  # basename can exist in many directories, so neither humans nor tools can tell
  # which file is meant, and the link silently rots when a file moves. Require an
  # explicit prefix: ./name, ../dir/name, or a multi-segment path dir/name.
  # Fragment-only (#...), root-absolute (/...), and URL links pass. pygrep is
  # built into prek — no external dependency, no companion file.
  #
  # Both skip release-plz's `CHANGELOG.md`: a pygrep hook has no configuration
  # of its own, and the changelog's links are the generator's.
  - repo: local
    hooks:
      - id: no-bare-relative-links
        name: inline markdown links must be explicit (./, ../, or a path)
        language: pygrep
        types: [markdown]
        exclude: ^CHANGELOG\.md$
        entry: '\]\((?!https?://|ftp://|mailto:|tel:|/|#|\.\.?/)[^)/\s:]+\.[A-Za-z0-9]+(?:#[^)]*)?\)'
      - id: no-bare-relative-link-defs
        name: markdown link definitions must be explicit (./, ../, or a path)
        language: pygrep
        types: [markdown]
        exclude: ^CHANGELOG\.md$
        entry: '^\s*\[[^\]]+\]:\s+(?!https?://|ftp://|mailto:|tel:|/|#|\.\.?/|<)[^\s/:#]+\.[A-Za-z0-9]+'

  # --- Markdown lint (style gate + ordered-list renumber autofix) ---
  #
  # Final order is emphasis check, table-pipe check, dprint, explicit relative-
  # link form checks, heading-shape wiring, then markdownlint. The generic
  # markdownlint hook keeps repository-wide style, relative-link integrity, and
  # ordered-list repair; three filtered hooks add the fixed document shapes from
  # `.markdownlint/`. markdownlint-cli2 runs AFTER dprint.
  # dprint owns all formatting; markdownlint flags issues dprint can't normalize.
  # Uses the node variant.
  # nodeenv cannot provision a usable Node here, so language_version: system
  # selects the flake's nodejs runtime — the same Nix-owns-the-runtime pattern
  # used by the dprint system hooks above.
  - repo: local
    hooks:
      # owner: devshell (no-hook-language) a script of this repository, run by the devShell python3.
      - id: markdown-heading-shapes
        name: markdown heading shapes are owned and wired one-to-one
        entry: scripts/check-markdown-heading-shapes
        language: system
        pass_filenames: false
        files: '^(\.markdownlint/|\.markdownlint-cli2\.jsonc$|\.pre-commit-config\.yaml$|scripts/check-markdown-heading-shapes$|.*\.(md|markdown)$)'
        stages: [pre-commit]

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      - id: markdownlint-cli2
        # `default: true` gives this hook MD025 (one top-level H1 per document)
        # and the relative-links rule, and a deck breaks both by construction:
        # every slide opens with an H1, and Slidev's `@/` and `<<<` references
        # are resolved by Vite, not by the filesystem walk the rule performs.
        # The same exclusion is repeated in .markdownlint-cli2.jsonc's
        # `ignores` so a direct invocation agrees with this hook.
        exclude: ^slides/
        language_version: system
        additional_dependencies: ['markdownlint-rule-relative-links']
      - id: markdownlint-cli2
        alias: md-slice-readme
        name: markdownlint slice entry heading shape
        files: '^docs/plan/slices/[^/]+/README\.md$'
        args: ['--config', '.markdownlint/slice-readme.markdownlint-cli2.jsonc']
        language_version: system
        additional_dependencies: ['markdownlint-rule-relative-links']
      - id: markdownlint-cli2
        alias: md-milestones
        name: markdownlint milestone heading shape
        files: '^docs/plan/milestones\.md$'
        args: ['--config', '.markdownlint/milestones.markdownlint-cli2.jsonc']
        language_version: system
        additional_dependencies: ['markdownlint-rule-relative-links']
      - id: markdownlint-cli2
        alias: md-adr
        name: markdownlint decision heading shape
        files: '^docs/decisions/(ADR-.*|template)\.md$'
        args: ['--config', '.markdownlint/adr.markdownlint-cli2.jsonc']
        language_version: system
        additional_dependencies: ['markdownlint-rule-relative-links']

  # --- Slides (Slidev deck) -------------------------------------------------
  #
  # Every Markdown gate above is excluded from `slides/`, so the deck's only
  # local check is whether it still builds. That is the check that matters: a
  # deck breaks at the Slidev layer — an unknown layout, a missing icon set, a
  # component that no longer resolves — and none of those are visible to a
  # linter reading the file as prose.
  #
  # Push-only, and scoped by `files:` so a push touching nothing under
  # `slides/` never pays for it. Same Nix-owns-the-runtime model as the cargo
  # and nix hooks at this stage: node comes from the devShell, Slidev comes
  # from `slides/node_modules`. The guard names the missing install rather
  # than letting npm report it as a missing script.
  - repo: local
    hooks:
      # owner: slides/package.json (project-environment) npm builds the deck from its own lock file.
      - id: slidev-build
        name: slidev build (deck still compiles)
        # Gated like its neighbours at this stage, and the honest note is that
        # what moves for it is `TMPDIR` alone: a deck's dependencies and its
        # built output are in-tree by construction, so `node_modules` and
        # `dist` stay where npm puts them no matter what this binds.
        entry: tests/host/heavy-run --need 2 --label "the slidev build" -- bash -c 'cd slides && { [ -d node_modules ] || { echo "slides/node_modules is missing; run \`just slides-install\`" >&2; exit 1; }; } && npm run build'
        language: system
        files: ^slides/
        pass_filenames: false
        stages: [pre-push, manual]

  # --- The configuration itself ---
  - repo: meta
    hooks:
      - id: check-useless-excludes

  # --- The round's own leftovers (report, never a gate) ---------------------
  #
  # Last in this file, which is what makes it last at the push stage: prek
  # runs hooks in declaration order, so a writer declared below this one would
  # leave a pile the report had already finished counting. By the time it runs,
  # everything that writes has written: the compile cache, the fixture roots, the
  # guest closures, the volumes a boot trial made, the deck build, and whatever a
  # hand-run lane left earlier in the session. The
  # report names each pile, its size, and the command that would clear it, and
  # leaves the deciding to whoever is reading — removing a sandbox volume is not
  # a call a hook may make on someone's behalf.
  #
  # It also answers the question the gate above raises: anything listed under
  # `host` is something a gated run puts on the drive, so a size there is
  # evidence that something ran outside the gate while the round is still fresh.
  #
  # `always_run` because it reports on the machine rather than on the diff, and
  # `verbose` because prek prints a passing hook's output only when asked
  # — and this one always passes. A push is never blocked by what is on a disk.
  - repo: local
    hooks:
      # owner: devshell (no-hook-language) a script of this repository under tests/host, which runs on the host.
      - id: leftovers
        name: leftover sweep (report only)
